<!--
HoursTag／HoursTag Lite 雙 11・黑五填空圖卡（hourstaglite-04 與 hourstag-04 共用素材）
用途：讓讀者用「自己的」實領時薪把購物車裡的價格換算成工時；不引用任何統計。結尾導向免費的 HoursTag Lite。
發在哪／給誰：The owner's own Threads / Instagram / X (English), 2026-11-20 to 11-26, the week before Black Friday. Pair with the en caption in cards-captions-and-posting-rules.md。
發文者：店主 Guan Feng Lai 本人帳號，以開發者身分發布（卡面底欄與貼文都已揭露）。
發文規則：每帳號每天最多 1 張；同一平台不重發；連結只放第一則留言，不印在圖上；Lite 商店頁截圖 ≥3 張（hourstaglite-01）之前不要發；不寫「最好用／第一」；不羞辱購物者。
第一則留言連結：https://apps.apple.com/app/id6794039979?pt=118326163&ct=htl_card_en&mt=8
匯出：用瀏覽器開啟後截圖，或以 rsvg-convert／Inkscape 轉成 1080x1350 PNG 再上傳。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d" xml:lang="en">
<title id="t">How many hours of work is this? (Black Friday fill-in card)</title>
<desc id="d">Fill-in card: price divided by your take-home pay per hour equals hours of work, with Need, Want and Impulse checkboxes. Made by the developer of HoursTag Lite.</desc>
<style>text{font-family:'SF Pro Display','Helvetica Neue','Inter','Segoe UI',Arial,sans-serif}</style>
<rect width="1080" height="1350" fill="#FBF6EE"/>
<rect x="80" y="78" width="520" height="64" rx="32" fill="#F6E3D3"/>
<text x="340" y="122" font-size="30" font-weight="700" fill="#B4532A" text-anchor="middle">Before Black Friday checkout</text>
<text x="80" y="252" font-size="92" font-weight="800" fill="#1F2A2E" text-anchor="start">How many hours</text>
<text x="80" y="364" font-size="92" font-weight="800" fill="#1F2A2E" text-anchor="start">of work is this?</text>
<rect x="80" y="440" width="920" height="470" rx="28" fill="#FFFFFF" stroke="#E6DCCF" stroke-width="3"/>
<text x="130" y="560" font-size="42" font-weight="500" fill="#1F2A2E" text-anchor="start">Price</text>
<text x="626" y="560" font-size="42" font-weight="600" fill="#1F2A2E" text-anchor="end">$</text>
<line x1="640" y1="570" x2="830" y2="570" stroke="#1F2A2E" stroke-width="4" stroke-linecap="round"/>
<text x="130" y="690" font-size="42" font-weight="500" fill="#1F2A2E" text-anchor="start">÷ Take-home per hour</text>
<text x="626" y="690" font-size="42" font-weight="600" fill="#1F2A2E" text-anchor="end">$</text>
<line x1="640" y1="700" x2="830" y2="700" stroke="#1F2A2E" stroke-width="4" stroke-linecap="round"/>
<line x1="130" y1="760" x2="950" y2="760" stroke="#E6DCCF" stroke-width="3"/>
<text x="130" y="840" font-size="42" font-weight="700" fill="#B4532A" text-anchor="start">= Hours of work</text>
<line x1="640" y1="850" x2="830" y2="850" stroke="#1F2A2E" stroke-width="4" stroke-linecap="round"/>
<text x="846" y="840" font-size="42" font-weight="700" fill="#B4532A" text-anchor="start">hours</text>
<text x="80" y="965" font-size="27" font-weight="400" fill="#6B6B6B" text-anchor="start">Take-home per hour = monthly take-home ÷ hours worked per month</text>
<rect x="100" y="1040" width="48" height="48" rx="8" fill="#FFFFFF" stroke="#1F2A2E" stroke-width="4"/>
<text x="170" y="1080" font-size="44" font-weight="600" fill="#1F2A2E" text-anchor="start">Need</text>
<rect x="390" y="1040" width="48" height="48" rx="8" fill="#FFFFFF" stroke="#1F2A2E" stroke-width="4"/>
<text x="460" y="1080" font-size="44" font-weight="600" fill="#1F2A2E" text-anchor="start">Want</text>
<rect x="680" y="1040" width="48" height="48" rx="8" fill="#FFFFFF" stroke="#1F2A2E" stroke-width="4"/>
<text x="750" y="1080" font-size="44" font-weight="600" fill="#1F2A2E" text-anchor="start">Impulse</text>
<text x="80" y="1170" font-size="44" font-weight="800" fill="#B4532A" text-anchor="start">Still want it after the maths? Buy it.</text>
<rect x="0" y="1210" width="1080" height="140" fill="#1F2A2E"/>
<text x="80" y="1252" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">HoursTag Lite · Free download · Prices turned into work time</text>
<text x="80" y="1292" font-size="22" font-weight="400" fill="#E9E4DC" text-anchor="start">Data stays on your phone · No account · 50 interface languages, switch in-app</text>
<text x="80" y="1328" font-size="21" font-weight="400" fill="#E9E4DC" text-anchor="start">Card made by the app's developer</text>
</svg>
