<!--
HoursTag／HoursTag Lite 雙 11・黑五填空圖卡（hourstaglite-04 與 hourstag-04 共用素材）
用途：讓讀者用「自己的」實領時薪把購物車裡的價格換算成工時；不引用任何統計。結尾導向免費的 HoursTag Lite。
發在哪／給誰：店主本人の X／Threads／Instagram（日本語）、2026/11/20–11/26（ブラックフライデー前の1週間）。../hourstag/double11-black-friday-card-copy.md の ja-1 投稿文と一緒に。投稿文の冒頭に【PR・自社アプリ】。
發文者：店主 Guan Feng Lai 本人帳號，以開發者身分發布（卡面底欄與貼文都已揭露）。
發文規則：每帳號每天最多 1 張；同一平台不重發；連結只放第一則留言，不印在圖上；Lite 商店頁截圖 ≥3 張（hourstaglite-01）之前不要發；不寫「最好用／第一」；不羞辱購物者。
第一則留言連結：https://apps.apple.com/app/id6794039979?pt=118326163&ct=htl_card_ja&mt=8
匯出：用瀏覽器開啟後截圖，或以 rsvg-convert／Inkscape 轉成 1080x1350 PNG 再上傳。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d" xml:lang="ja">
<title id="t">これ、何時間ぶんの仕事？（ブラックフライデー記入式カード）</title>
<desc id="d">記入式のカード。値段 ÷ 手取り時給 ＝ 働く時間。下に「必要・欲しい・衝動」のチェック欄。HoursTag Lite の開発者が作成。</desc>
<style>text{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif}</style>
<rect width="1080" height="1350" fill="#FBF6EE"/>
<rect x="80" y="78" width="600" height="64" rx="32" fill="#F6E3D3"/>
<text x="380" y="122" font-size="30" font-weight="700" fill="#B4532A" text-anchor="middle">ブラックフライデー、カート確定の前に</text>
<text x="80" y="260" font-size="100" font-weight="800" fill="#1F2A2E" text-anchor="start">これ、何時間</text>
<text x="80" y="380" font-size="100" font-weight="800" fill="#1F2A2E" text-anchor="start">ぶんの仕事？</text>
<rect x="80" y="440" width="920" height="470" rx="28" fill="#FFFFFF" stroke="#E6DCCF" stroke-width="3"/>
<text x="130" y="560" font-size="48" font-weight="500" fill="#1F2A2E" text-anchor="start">値段</text>
<line x1="560" y1="570" x2="860" y2="570" stroke="#1F2A2E" stroke-width="4" stroke-linecap="round"/>
<text x="884" y="560" font-size="48" font-weight="500" fill="#1F2A2E" text-anchor="start">円</text>
<text x="130" y="690" font-size="48" font-weight="500" fill="#1F2A2E" text-anchor="start">÷ 手取り時給</text>
<line x1="560" y1="700" x2="860" y2="700" stroke="#1F2A2E" stroke-width="4" stroke-linecap="round"/>
<text x="884" y="690" font-size="48" font-weight="500" fill="#1F2A2E" text-anchor="start">円</text>
<line x1="130" y1="760" x2="950" y2="760" stroke="#E6DCCF" stroke-width="3"/>
<text x="130" y="840" font-size="48" font-weight="700" fill="#B4532A" text-anchor="start">＝ 働く時間</text>
<line x1="560" y1="850" x2="860" y2="850" stroke="#1F2A2E" stroke-width="4" stroke-linecap="round"/>
<text x="884" y="840" font-size="48" font-weight="700" fill="#B4532A" text-anchor="start">時間</text>
<text x="80" y="965" font-size="32" font-weight="400" fill="#6B6B6B" text-anchor="start">手取り時給＝月の手取り ÷ 月の実働時間</text>
<rect x="100" y="1040" width="48" height="48" rx="8" fill="#FFFFFF" stroke="#1F2A2E" stroke-width="4"/>
<text x="170" y="1080" font-size="44" font-weight="600" fill="#1F2A2E" text-anchor="start">必要</text>
<rect x="390" y="1040" width="48" height="48" rx="8" fill="#FFFFFF" stroke="#1F2A2E" stroke-width="4"/>
<text x="460" y="1080" font-size="44" font-weight="600" fill="#1F2A2E" text-anchor="start">欲しい</text>
<rect x="680" y="1040" width="48" height="48" rx="8" fill="#FFFFFF" stroke="#1F2A2E" stroke-width="4"/>
<text x="750" y="1080" font-size="44" font-weight="600" fill="#1F2A2E" text-anchor="start">衝動</text>
<text x="80" y="1170" font-size="46" font-weight="800" fill="#B4532A" text-anchor="start">計算しても欲しければ、買えばいい。</text>
<rect x="0" y="1210" width="1080" height="140" fill="#1F2A2E"/>
<text x="80" y="1252" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="start">HoursTag Lite｜無料ダウンロード・値段を働く時間に換算</text>
<text x="80" y="1295" font-size="23" font-weight="400" fill="#E9E4DC" text-anchor="start">データは端末内だけ・アカウント不要・表示言語は50言語（アプリ内で切替）</text>
<text x="80" y="1332" font-size="22" font-weight="400" fill="#E9E4DC" text-anchor="start">開発者本人が作成した画像です</text>
</svg>
