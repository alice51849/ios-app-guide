<!--
草稿標頭（tripplanet-03）
用途：Threads／Instagram 用的 1080×1350 預覽圖卡，展示可列印「機場＋機上小任務卡」裡的 4 張；完整 12 張見同資料夾的 airport-flight-mission-cards-*.html。
發在哪／給誰：店主本人的 Threads、Instagram（輪播第 1 張）。讀者：要帶孩子搭飛機的台灣（繁中版）與日本（日文版）家長。
發文者：店主 Guan Feng Lai 本人；貼文正文寫明自己是開發者（文案見 mission-cards-share-posts.md）。
發文規則：社群平台不收 SVG，發文前請用瀏覽器開啟後輸出成 1080×1350 PNG；圖上不放 App 名稱或 App Store 標誌（App 只在貼文結尾提一次）；不改成拍照任務；不加分數或排名。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="子連れフライト：空港と機内のミッションカードのプレビュー" xml:lang="ja" font-family="&#x27;Hiragino Sans&#x27;,&#x27;Hiragino Kaku Gothic ProN&#x27;,&#x27;Noto Sans JP&#x27;,&#x27;Yu Gothic&#x27;,Meiryo,sans-serif">
<defs><linearGradient id="band" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17213b"/><stop offset="1" stop-color="#303b67"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6858d9"/><stop offset="1" stop-color="#f47c67"/></linearGradient><clipPath id="cardclip"><rect width="450" height="340" rx="28"/></clipPath></defs>
<rect width="1080" height="1350" fill="#fff9ed"/>
