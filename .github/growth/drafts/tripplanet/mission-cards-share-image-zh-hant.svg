<text x="540" y="380" text-anchor="middle" font-size="30" font-weight="600" fill="#e8e9f5">另附 2 張空白卡・任何一張都可跳過</text>
<g transform="translate(60 470)">
<rect width="450" height="340" rx="28" fill="#fffdf8" stroke="#ddd7ca" stroke-width="2"/>
<rect width="450" height="14" fill="url(#bar)" clip-path="url(#cardclip)"/>
<rect x="32" y="40" width="92" height="44" rx="22" fill="#dff4e9"/>
<text x="52" y="70" font-size="26" font-weight="800" fill="#18213b">機場</text>
<text x="32" y="134" font-size="40" font-weight="800" fill="#18213b">從目前等待位置</text>
<text x="32" y="182" font-size="40" font-weight="800" fill="#18213b">看得到的兩種標誌</text>
<text x="32" y="228" font-size="24" fill="#3c4458">從原地找找看，</text>
<text x="32" y="262" font-size="24" fill="#3c4458">大人確認安全才指出來</text>
<text x="32" y="312" font-size="22" font-weight="700" fill="#5f677b">任何一張都可跳過</text>
