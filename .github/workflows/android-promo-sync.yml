name: Android promo sync

# The Mac's Google Play scan pushes _engine/geo/data/android_live_snapshot.json
# whenever an app goes live. Posts (Telegram, Threads, hook clips) read the
# snapshot when they go out; this refreshes the promotion page
# (office.cait518.cc) so its Android list and links match right away.
on:
  push:
    branches: [main]
    paths:
      - _engine/geo/data/android_live_snapshot.json
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read # growth_records.py: is geo-daily running?
  contents: write

concurrency:
  group: android-promo-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read records still waiting on the growth-records-pending branch
        # geo-daily holds bot record pushes off main while it runs (growth_records.py);
        # dedupe and the promotion page read them from here until they are merged.
        run: python3 .github/scripts/growth_records.py overlay
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh the promotion page
        env:
          GITHUB_TOKEN: ${{ github.token }} # growth_records.py checks whether geo-daily is running
        run: |
          for i in 1 2 3; do
            target="$(python3 .github/scripts/growth_records.py prepare)"
            # Compare the page minus its clock line (clip_progress.section_body).
            before="$(python3 .github/scripts/clip_progress.py --print-section-body)"
            python3 .github/scripts/clip_progress.py
            after="$(python3 .github/scripts/clip_progress.py --print-section-body)"
            if [ "$before" = "$after" ]; then echo "page already current"; exit 0; fi
            python3 .github/scripts/test_app_improvements.py
            git add .github/growth/app-improvements.json
            git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "外宣頁：Android 上線清單同步 [skip ci]"
            if python3 .github/scripts/growth_records.py push "$target"; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1
