name: Daily Arquivo.pt archive

# 2026-10-15 業主停用（「Arquivo 就不要做了 直接移除這個工作」）：Arquivo.pt 自 10/10 起持續 503／連不上，
# 每天紅燈只會灌高看板異常數。移除排程、只留手動觸發；監看與自動補發已從 line_watchdog、
# 00_GrowthEngine agent/cloud_workflow_watchdog.py 與 github_recovery_watchdog.sh 拿掉。檔案保留不刪。
on:
  workflow_dispatch:
    inputs:
      app:
        description: Live app guide slug (optional)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: arquivo-pt-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify live-app rotation and bounded delivery
        run: python3 .github/scripts/test_arquivo_pt_archive.py -q
      - name: Archive one live app guide
        env:
          ARQUIVO_APP: ${{ inputs.app }}
        run: python3 .github/scripts/arquivo_pt_archive.py
