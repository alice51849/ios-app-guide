name: Hook clip backup posts

# GitHub sometimes drops or delays scheduled runs by hours (10/14: the 15:00
# UTC Telegram run never came, so the day's clip was never posted). This
# backup runs two hours after each clip slot and posts the clip planned for
# that slot on every channel that has not posted it yet. clip_posts.py skips
# a clip already in clip-posts.json, so a backup only fills a miss and never
# re-posts. It never makes the channels' other daily posts.
#
# The slot comes from github.event.schedule, not the clock, so a backup GitHub
# itself delays by hours still fills the slot it was meant for, on the date
# that slot was on.
#
# Threads: threads_backfill.py starts threads-post.yml (mode=post) for each
# Threads slot of the current Taiwan day (01:40 clip, 03:00 picture, 13:00
# evening series) that no threads-post run filled or is running. That run's
# slot gate stops a double post, and its cap check keeps the account at 3
# posts a Taiwan day (threads-autopilot included). Only today's Taiwan slots
# are filled, so a backup never takes tomorrow's room.
#
# Slots follow .github/growth/volume-ramp.json (reels-daily.yml / telegram-clips.yml
# crons): 1, 9, 12, 15, 18 and 22 UTC; a backup for a slot clips.json does not
# plan (an earlier ramp stage) finds nothing and posts nothing. The 00:47 run
# backs up the previous day's 22:xx slot.
# run-name records the slot's cron (also on a catch-up the Mac's cron dispatcher,
# 00_GrowthEngine tools/cron_dispatcher, starts when GitHub dropped the cron), so
# social_slot_gate.py and the dispatcher tell which slot a run was for however
# late it started.
run-name: >-
  ${{ (github.event.schedule || inputs.cron)
  && format('Hook clip backup posts · cron {0}', github.event.schedule || inputs.cron)
  || 'Hook clip backup posts' }}
on:
  schedule:
    - cron: '47 0 * * *'    # after the 22:xx slot (US evening) of the day before
    - cron: '47 3 * * *'    # after the 01:xx slot (Asia morning); Threads 01:40 + 03:00
    - cron: '47 11 * * *'   # after the 09:xx slot (Asia evening / Europe morning)
    - cron: '47 14 * * *'   # after the 12:xx slot (Taipei 20:xx); Threads: the 13:00 evening slot, before Taiwan midnight
    - cron: '47 17 * * *'   # after the 15:xx slot (Americas)
    - cron: '47 20 * * *'   # after the 18:xx slot (US afternoon)
  workflow_dispatch:
    inputs:
      slot:
        description: "Clip slot to back up on Telegram/Instagram (1, 9, 12, 15, 18 or 22; empty = Threads check only)"
        required: false
        default: ""
      date:
        description: "UTC date YYYY-MM-DD of that clip slot (empty = today)"
        required: false
        default: ""
      cron:
        description: "Cron dispatcher only: the missed schedule this run replaces, e.g. 47 3 * * *; runs like that scheduled run, slot gate included"
        default: ""

permissions:
  contents: write
  actions: write # threads_backfill.py dispatches threads-post.yml
  issues: write  # volume_ramp.py opens a volume-throttle issue when a platform says slow down

concurrency:
  group: clip-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Which slot
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule || inputs.cron }}
          MANUAL_SLOT: ${{ inputs.slot }}
          MANUAL_DATE: ${{ inputs.date }}
        run: |
          # The cron that fired (or the one a catch-up dispatch names) decides the slot
          # and its date, however late it runs.
          back=0
          case "$SCHEDULE" in
            "47 0 * * *")  s=22; fired="00:47"; back=1 ;;   # the slot was on the day before
            "47 3 * * *")  s=1;  fired="03:47" ;;
            "47 11 * * *") s=9;  fired="11:47" ;;
            "47 14 * * *") s=12; fired="14:47" ;;
            "47 17 * * *") s=15; fired="17:47" ;;
            "47 20 * * *") s=18; fired="20:47" ;;
            *)             s=;   fired= ;;
          esac
          if [ -n "$fired" ]; then
            d=$(date -u -d "-$back day" +%F)
            if [ "$(date -u +%H:%M)" \< "$fired" ]; then d=$(date -u -d "$d -1 day" +%F); fi
          else
            case "$MANUAL_SLOT" in 1|9|12|15|18|22) s=$MANUAL_SLOT ;; "") s= ;; *) echo "::error::slot must be 1, 9, 12, 15, 18 or 22"; exit 1 ;; esac
            d=${MANUAL_DATE:-$(date -u +%F)}
            case "$d" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::date must be YYYY-MM-DD"; exit 1 ;; esac
            date -u -d "$d" +%F >/dev/null 2>&1 || { echo "::error::bad date $d"; exit 1; }
          fi
          echo "slot=$s" >> "$GITHUB_OUTPUT"; echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "slot=${s:-none} date=$d"
      - name: Test
        if: steps.slot.outputs.slot != ''
        run: |
          python3 .github/scripts/test_volume_ramp.py -q
          python3 .github/scripts/test_clip_posts.py -q
      - name: Telegram
        if: steps.slot.outputs.slot != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/clip_posts.py telegram --slot "${{ steps.slot.outputs.slot }}" --date "${{ steps.slot.outputs.date }}"
      - name: Instagram
        if: steps.slot.outputs.slot != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 .github/scripts/clip_posts.py instagram --slot "${{ steps.slot.outputs.slot }}" --date "${{ steps.slot.outputs.date }}"
      - name: Threads
        # Never posts here: it starts threads-post.yml (mode=post) for each
        # missed Threads slot of the current Taiwan day, so every Threads post
        # goes through that workflow's slot gate and account cap
        # (threads_series.py room, 3 a Taiwan day). The evening slot is only
        # refilled before Taiwan midnight, so it never makes a 4th post or
        # takes tomorrow's room; a 17:47 backup finds no due Threads slot.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/test_threads_backfill.py -q
          python3 .github/scripts/threads_backfill.py
      - name: Record the post links on the promotion page (and any throttle)
        if: steps.slot.outputs.slot != ''
        run: |
          if [ -z "$(git status --porcelain -- .github/growth/clip-posts.json .github/growth/volume-ramp.json)" ]; then echo "nothing posted"; exit 0; fi
          cp .github/growth/clip-posts.json "$RUNNER_TEMP/clip-posts.json"
          cp .github/growth/volume-ramp.json "$RUNNER_TEMP/volume-ramp.json"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 .github/scripts/clip_progress.py --merge-log "$RUNNER_TEMP/clip-posts.json"
            # The Instagram profile link https://open.cait518.cc/ig/: the new post's app on top (ig_bio_hub.py;
            # the root site mirrors it). Never blocks recording the post.
            python3 .github/scripts/ig_bio_hub.py build || echo "::warning::IG profile-link hub not rebuilt (ig-bio-hub.yml retries daily)"
            python3 .github/scripts/volume_ramp.py --merge "$RUNNER_TEMP/volume-ramp.json"
            git add .github/growth/clip-posts.json .github/growth/app-improvements.json .github/growth/volume-ramp.json .github/growth/ig-hub
            git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "鉤子片補發紀錄：外宣頁連結更新 [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::could not record the backup clip posts"; exit 1
