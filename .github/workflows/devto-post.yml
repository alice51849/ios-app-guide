name: Dev.to auto post

on:
  schedule:
    - cron: "0 10 * * *"   # 每日檢查;script 嚴格限制每篇至少間隔 72 小時
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify social automation
        run: python3 .github/scripts/test_social_posting.py -q
      - name: Publish next unposted article to Dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python3 .github/scripts/devto_post.py
