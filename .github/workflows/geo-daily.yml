name: Daily GEO content

on:
  schedule:
    # 每天 4 次(每 6 小時,離峰分鐘)→ 全天候不間斷產內容
    - cron: "23 1 * * *"
    - cron: "23 7 * * *"
    - cron: "23 13 * * *"
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      answers:
        description: "New answer pages to generate"
        default: "8"

permissions:
  contents: write

concurrency:
  group: geo-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GEO_SITE: https://alice51849.github.io/ios-app-guide
      OPENAI_MODEL: gpt-4o-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision OpenAI key
        run: printf '%s' "${{ secrets.OPENAI_KEY }}" > "$HOME/.openai_key"
      - name: Link site dir into engine layout
        run: |
          rm -rf _engine/geo/pages
          ln -s "$GITHUB_WORKSPACE" _engine/geo/pages
      - name: Generate new answer pages (+ rebuild answers sitemap)
        run: |
          N="${{ github.event.inputs.answers || '8' }}"
          cd _engine/geo
          python3 aeo_answers.py --limit "$N" || echo "aeo_answers exited $?"
      - name: Refresh hubs + Atom feed + llms.txt / sitemaps
        run: |
          cd _engine/geo
          python3 gen_hubs.py || echo "gen_hubs exited $?"
          python3 gen_feed.py || echo "gen_feed exited $?"
          python3 gen_llms.py || echo "gen_llms exited $?"
      - name: Commit English content first (fast, before slow localization)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Daily GEO content: new answer pages + refreshed sitemaps"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Localize a small batch (best-effort; may be slow / rate-limited)
        run: |
          cd _engine/geo
          timeout 25m python3 aeo_answers_i18n.py --limit 2 || echo "aeo_answers_i18n stopped ($?)"
      - name: Unlink site dir
        run: rm -f _engine/geo/pages
      - name: Commit localized pages if any
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No localized changes."
          else
            git commit -m "Daily GEO content: localized answer pages"
            git pull --rebase --autostash || true
            git push
          fi
