name: Daily GEO content

on:
  schedule:
    # 每天 4 次(每 6 小時,離峰分鐘)→ 全天候不間斷產內容
    - cron: "23 1 * * *"
    - cron: "23 7 * * *"
    - cron: "23 13 * * *"
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      answers:
        description: "New answer pages to generate"
        default: "8"

permissions:
  contents: write

concurrency:
  group: ios-app-guide-main-writer
  cancel-in-progress: false
  queue: max

jobs:
  generate:
    runs-on: ubuntu-latest
    # A hung generator used to spin for 10+ hours and block every later
    # scheduled run; fail loudly instead so the next schedule can retry.
    timeout-minutes: 180
    env:
      GEO_SITE: https://open.cait518.cc/ios-app-guide
      GROWTH_LIVE_MANIFEST: ${{ github.workspace }}/.growth-runtime/live-app-manifest.json
      GEO_REPORTS: ${{ github.workspace }}/.growth-runtime/outreach
      # Apple campaign-link provider token. Not a secret: it is published
      # verbatim inside every ?pt= App Store link on this site. Without it
      # gen_store_attribution.py is a silent no-op and the daily rebuild
      # strips campaign tokens off every page it regenerates.
      APP_STORE_PROVIDER_TOKEN: "118326163"
      STANDARD_SITE_GUIDE_CONTRACT_URL: https://raw.githubusercontent.com/alice51849/alice51849.github.io/main/standard_site_guide_contract.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            _engine/geo/requirements-validation.txt
            _engine/geo/requirements-iiif-validation.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: |
          python3 -m pip install --requirement _engine/geo/requirements-validation.txt
          python3 -m venv "$RUNNER_TEMP/iiif-validator"
          "$RUNNER_TEMP/iiif-validator/bin/pip" install \
            --requirement _engine/geo/requirements-iiif-validation.txt
          mkdir -p "$RUNNER_TEMP/iiif-validator-bin"
          ln -s "$RUNNER_TEMP/iiif-validator/bin/iiif-validator" \
            "$RUNNER_TEMP/iiif-validator-bin/iiif-validator"
          echo "$RUNNER_TEMP/iiif-validator-bin" >> "$GITHUB_PATH"
      - name: Link site dir into engine layout
        run: |
          rm -rf _engine/geo/pages
          ln -s "$GITHUB_WORKSPACE" _engine/geo/pages
      - name: Verify pre-materialization contracts
        run: |
          python3 -m unittest \
            _engine.geo.tests.test_publisher_intent_catalog.PublisherIntentLocalizationTests.test_purchase_labels_exist_in_i18n_strings
      - name: Snapshot truthful sitemap baseline
        run: |
          state="$RUNNER_TEMP/sitemap-lastmod-intermediate.json"
          rm -f "$state"
          if test -f _engine/geo/sitemap_lastmod_state.json; then
            cp _engine/geo/sitemap_lastmod_state.json \
              "$state"
          fi
          workflow_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          build_date="${workflow_started_at%%T*}"
          echo "SITEMAP_LASTMOD_INTERMEDIATE_STATE=$state" >> "$GITHUB_ENV"
          echo "GEO_BUILD_DATE=$build_date" >> "$GITHUB_ENV"
          echo "GEO_WORKFLOW_STARTED_AT=$workflow_started_at" >> "$GITHUB_ENV"
      - name: Restore last-good availability evidence
        uses: actions/cache/restore@v4
        with:
          path: .growth-runtime/live-app-manifest.json
          key: live-availability-v2-${{ hashFiles('_engine/geo/live_app_manifest.json', '_engine/social/videogen/registry*.json', '_engine/social/videogen/registry.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            live-availability-v2-${{ hashFiles('_engine/geo/live_app_manifest.json', '_engine/social/videogen/registry*.json', '_engine/social/videogen/registry.py') }}-
      - name: Refresh verified App Store availability once
        run: |
          python3 _engine/geo/live_app_manifest.py --refresh \
            --output "$GROWTH_LIVE_MANIFEST" \
            --live-state-output "$GITHUB_WORKSPACE/.appstore_live_state.json"
          cd _engine/geo
          python3 refresh_storefront_availability.py
      - name: Save last-good availability evidence
        uses: actions/cache/save@v4
        with:
          path: .growth-runtime/live-app-manifest.json
          key: live-availability-v2-${{ hashFiles('_engine/geo/live_app_manifest.json', '_engine/social/videogen/registry*.json', '_engine/social/videogen/registry.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Materialize newly live app surfaces
        run: |
          cd _engine/geo
          python3 build_pages_i18n.py --cached-live --missing-apps
          python3 aeo_guide.py --missing
          python3 ensure_live_guides.py
          python3 gen_webstories.py
          python3 gen_webstories_i18n.py
          # Linkset validation owns each live App's hub, so create new hubs
          # before the Linkset is allowed to fail closed on missing resources.
          python3 gen_hubs.py
          python3 gen_linkset.py
          python3 gen_social_previews.py
          python3 gen_image_sitemap.py
          python3 gen_mobile_app_identity.py
          python3 gen_webmcp_install_tools.py
          python3 portfolio_app_catalog_api.py
          # Regenerate this tracked tool before the disclosure gate; otherwise
          # a source-only copy update leaves the prior HTML claim in place.
          python3 zhuyin_readiness_tool.py
          python3 gen_publisher_disclosures.py
          python3 gen_guide_design.py
          python3 gen_app_store_facts.py
          # The Finder first writes the newly live app's raw catalogue record
          # and rebuilds publisher intents from it. Decision routes consume
          # that exact-coverage intent dataset, so they cannot bootstrap first.
          python3 portfolio_app_finder.py
          # The buyer-intent catalog requires exact Finder/persona coverage,
          # so every Finder-dependent surface must follow the rebuild above.
          python3 publisher_intent_catalog.py --today "$GEO_BUILD_DATE"
          # Decision-route oEmbed records fail closed unless every localized
          # buyer-intent visual already exists.
          python3 publisher_intent_visuals.py --today "$GEO_BUILD_DATE"
          python3 app_install_decision_routes.py
          python3 high_intent_decision_routes.py \
            --inventory "$GITHUB_WORKSPACE/data/verified-ios-app-finder-catalog.json" \
            --output-dir "$GITHUB_WORKSPACE" \
            --materialize-current-inventory
          python3 gen_github_discovery_readmes.py
          python3 portfolio_offer_catalog.py --today "$GEO_BUILD_DATE"
          python3 app_video_lessons.py --today "$GEO_BUILD_DATE"
          python3 gen_social_previews.py --oembed-only
          python3 normalize_app_store_links.py
          python3 gen_app_decision_cards.py
          # Full-tree cleanup 1/3 keeps the pre-gate snapshot self-healing.
          python3 cleanup_localized_assets.py --cached-live
          python3 gen_app_store_conversion_surfaces.py
          # Same reason: the semantic-integrity gate runs before the repair
          # step further down, so repair here and let it fail closed if the
          # published answers still cannot be reconciled.
          python3 reconcile_answer_semantics.py --repair
          # Must stay after every generator that rewrites page bodies: those
          # emit clean store URLs, and this is what re-attaches ?pt&ct&mt.
          python3 gen_store_attribution.py
          python3 validate_webstories.py
          python3 gen_llms.py --cached-live
          python3 hero_tasks.py --today "$GEO_BUILD_DATE"
          python3 gen_feed.py
          python3 live_app_guard.py --site-root pages
      - name: Reconcile verified Standard.site discovery links
        run: |
          python3 _engine/geo/sync_standard_site.py \
            --site-root "$GITHUB_WORKSPACE" \
            --contract-url "$STANDARD_SITE_GUIDE_CONTRACT_URL" \
            --allow-initial-404 \
            --timeout 10 \
            --retries 3 \
            --retry-delay 2
      - name: Close preflight sitemap graph
        run: |
          cd _engine/geo
          # Standard.site sync post-processes route heads. Re-materialize so
          # those verified links are preserved and sealed into byte digests.
          python3 high_intent_decision_routes.py \
            --inventory "$GITHUB_WORKSPACE/data/verified-ios-app-finder-catalog.json" \
            --output-dir "$GITHUB_WORKSPACE" \
            --materialize-current-inventory
          # Materialization can add locale and per-App sitemaps. Close their
          # recursive union before the full-tree hygiene test inspects it.
          python3 dedupe_locale_meta.py --apply
          python3 gen_locale_indexation.py
          python3 gen_link_hubs.py
          python3 gen_locale_indexation.py
          python3 gen_link_hubs.py --check
          python3 close_sitemap_graph.py
          python3 publisher_intent_visuals.py --today "$GEO_BUILD_DATE"
          python3 gen_store_attribution.py
          python3 hero_tasks.py --today "$GEO_BUILD_DATE"
          python3 gen_feed.py
          python3 audit_link_depth.py --max-indexable-orphans 0
          python3 high_intent_decision_routes.py \
            --inventory "$GITHUB_WORKSPACE/data/verified-ios-app-finder-catalog.json" \
            --output-dir "$GITHUB_WORKSPACE" \
            --check-materialization-closure
          cd "$GITHUB_WORKSPACE"
          python3 _engine/geo/gen_sitemap_lastmod.py \
            --today "$GEO_BUILD_DATE" \
            --workflow-started-at "$GEO_WORKFLOW_STARTED_AT" \
            --state "$SITEMAP_LASTMOD_INTERMEDIATE_STATE"
      - name: Verify zero-cost growth infrastructure
        run: |
          python3 _engine/geo/parallel_unittest.py --jobs 3
          STANDARD_SITE_ENGINE_ROOT="$GITHUB_WORKSPACE/_engine" \
            python3 -m unittest discover \
              -s _engine/social/tests \
              -p "test_standard_site.py"
      - name: Rebuild availability-dependent surfaces
        run: |
          cd _engine/geo
          python3 build_pages_i18n.py --cached-live
          python3 passport_photo_print_sheet.py
          python3 document_scan_planner.py
          python3 blurry_photo_diagnostic.py
          python3 daily_checklist_planner.py
          python3 cycle_privacy_planner.py
          python3 screen_time_block_planner.py
          python3 hourstag_work_hours_tool.py
          python3 photo_storage_cleanup_planner.py
          python3 film_look_recipe_planner.py
          python3 family_routine_card_planner.py
          python3 resume_evidence_planner.py
          python3 vocabulary_habit_planner.py
          python3 toeic_study_allocation_planner.py
          python3 bopomofo_symbol_contrast_cards.py
          python3 bopomofo_matching_pair_cards.py
          python3 bopomofo_bingo_cards.py
          python3 bopomofo_flashcards.py
          python3 bopomofo_practice_sheet.py
          python3 wordmate_language_support.py
          python3 portfolio_app_finder.py
          python3 portfolio_cost_calculator.py
          python3 outreach_scorecard.py
      - name: Generate new answer pages (+ rebuild answers sitemap)
        run: |
          cd _engine/geo
          # The strict outreach gate runs in this same workflow, so a bounded
          # batch can never commit the first generation for an App with more
          # missing questions than the limit.
          python3 aeo_answers.py --cached-live
          # Category questions now owned by the free sibling are re-rendered
          # from the free key so the free door gets its own honest answer.
          python3 reclaim_free_first_answers.py
          python3 refresh_primary_resource_answers.py
      - name: Refresh AI indexes + hubs
        run: |
          cd _engine/geo
          python3 gen_roundups.py
          python3 aeo_pages.py --cached-live
          python3 gen_cost_compare.py
          python3 gen_calculator.py
          python3 gen_data_hub.py
          python3 agent_product_feed.py
          python3 family_travel_static_api.py
          python3 family_travel_observation_passport.py
          python3 family_travel_opds_catalog.py
          python3 family_travel_ro_crate.py
          python3 family_travel_mission_cards.py
          python3 zhuyin_heritage_lesson_plan.py
          python3 zhuyin_readiness_tool.py
          python3 zhuyin_grandparent_call_kit.py
          python3 zhuyin_picture_book_club_kit.py
          python3 zhuyin_parent_teacher_handoff_kit.py
          python3 zhuyin_library_storytime_kit.py
          python3 zhuyin_grade1_summer_calendar.py
          python3 zhuyin_blending_card_generator.py
          python3 zhuyin_sentence_reading_cards.py
          python3 zhuyin_mini_reader.py
          python3 zhuyin_story_sequence_cards.py
          python3 zhuyin_grade1_guide.py
          python3 zhuyin_anki_deck.py
          python3 zhuyin_skos_vocabulary.py
          python3 zhuyin_croissant_dataset.py
          python3 zhuyin_frictionless_package.py
          python3 zhuyin_csvw_metadata.py
          python3 zhuyin_bagit_package.py
          python3 zhuyin_ocfl_object.py
          python3 zhuyin_iiif_presentation.py
          python3 zhuyin_ro_crate.py
          python3 zhuyin_mets_premis_package.py
          python3 zhuyin_static_api.py
          python3 zhuyin_ldes_event_stream.py
          python3 zhuyin_ore_resource_map.py
          python3 zhuyin_lms_assessment_bank.py
          python3 zhuyin_epub_opds.py
          python3 zhuyin_library_catalog.py
          python3 zhuyin_oer_metadata.py
          python3 zhuyin_dcat_catalog.py
          python3 prioritize_trip_planet_resources.py
          python3 gen_hubs.py
          python3 gen_app_catalog.py
          python3 aeo_answers.py --cached-live --limit 0
          python3 reconcile_answer_semantics.py --repair
          python3 family_outing_weather_planner.py
          python3 fix_en_hreflang.py
          for loc in "" "--locale zh-Hant" "--locale zh-Hans" "--locale ja" "--locale ko" "--locale es-ES" "--locale es-MX" "--locale de-DE" "--locale fr-FR" "--locale pt-BR" "--locale ms" "--locale ar-SA" "--locale pl"; do
            python3 add_related_answers.py $loc
          done
          python3 add_related_tools.py --all-official-locales
          python3 ensure_live_guides.py
          python3 gen_webstories.py
          python3 gen_webstories_i18n.py
          python3 gen_linkset.py
          python3 gen_social_previews.py
          python3 gen_image_sitemap.py
          python3 gen_mobile_app_identity.py
          python3 gen_webmcp_install_tools.py
          python3 portfolio_app_catalog_api.py
          python3 publisher_intent_catalog.py --today "$GEO_BUILD_DATE"
          python3 portfolio_offer_catalog.py --today "$GEO_BUILD_DATE"
          python3 publisher_intent_visuals.py --today "$GEO_BUILD_DATE"
          python3 app_video_lessons.py --today "$GEO_BUILD_DATE"
          python3 gen_social_previews.py --oembed-only
          python3 gen_github_discovery_readmes.py
          python3 gen_publisher_disclosures.py
          python3 gen_guide_design.py
          python3 gen_app_store_facts.py
          python3 app_install_decision_routes.py
          python3 normalize_app_store_links.py
          # ResourceSync emits a Bopomofo page with a clean store URL. Keep it
          # before every conversion surface and the final attribution pass.
          python3 zhuyin_resourcesync.py
          python3 gen_app_decision_cards.py
          # Full-tree cleanup 2/3 runs after every English body generator.
          python3 cleanup_localized_assets.py --cached-live
          python3 gen_app_store_conversion_surfaces.py
          # Must stay after every generator that rewrites page bodies: those
          # emit clean store URLs, and this is what re-attaches ?pt&ct&mt.
          python3 gen_store_attribution.py
          python3 validate_webstories.py
          python3 gen_llms.py --cached-live
          python3 hero_tasks.py --today "$GEO_BUILD_DATE"
          python3 gen_feed.py
          python3 reconcile_answer_semantics.py
          python3 outreach_scorecard.py --require-complete
          cd "$GITHUB_WORKSPACE"
          python3 _engine/geo/sync_standard_site.py \
            --site-root "$GITHUB_WORKSPACE" \
            --contract-url "$STANDARD_SITE_GUIDE_CONTRACT_URL" \
            --allow-initial-404 \
            --timeout 10 \
            --retries 3 \
            --retry-delay 2
           python3 _engine/geo/publisher_intent_visuals.py \
             --today "$GEO_BUILD_DATE"
           python3 _engine/geo/gen_sitemap_lastmod.py \
            --today "$GEO_BUILD_DATE" \
            --workflow-started-at "$GEO_WORKFLOW_STARTED_AT" \
            --state "$SITEMAP_LASTMOD_INTERMEDIATE_STATE"
      - name: Commit English content first (fast, before slow localization)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Daily GEO content: new answer pages + refreshed sitemaps"
            source .github/scripts/remote-first-publish.sh
            reconcile_english_phase() {
              python3 _engine/geo/sync_standard_site.py \
                --site-root "$GITHUB_WORKSPACE" \
                --contract-url "$STANDARD_SITE_GUIDE_CONTRACT_URL" \
                --allow-initial-404 \
                --timeout 10 \
                --retries 3 \
                --retry-delay 2
              python3 _engine/geo/reconcile_answer_semantics.py
              cd _engine/geo
              python3 dedupe_locale_meta.py --apply
              python3 gen_locale_indexation.py
              python3 gen_link_hubs.py
              python3 gen_locale_indexation.py
              python3 gen_link_hubs.py --check
              python3 high_intent_decision_routes.py \
                --inventory "$GITHUB_WORKSPACE/data/verified-ios-app-finder-catalog.json" \
                --output-dir "$GITHUB_WORKSPACE" \
                --materialize-current-inventory
              python3 close_sitemap_graph.py
              python3 publisher_intent_visuals.py --today "$GEO_BUILD_DATE"
              python3 gen_store_attribution.py
              python3 hero_tasks.py --today "$GEO_BUILD_DATE"
              python3 gen_feed.py
              python3 audit_link_depth.py --max-indexable-orphans 0
              python3 high_intent_decision_routes.py \
                --inventory "$GITHUB_WORKSPACE/data/verified-ios-app-finder-catalog.json" \
                --output-dir "$GITHUB_WORKSPACE" \
                --check-materialization-closure
              cd "$GITHUB_WORKSPACE"
              python3 _engine/geo/gen_sitemap_lastmod.py \
                --today "$GEO_BUILD_DATE" \
                --workflow-started-at "$GEO_WORKFLOW_STARTED_AT" \
                --state "$SITEMAP_LASTMOD_INTERMEDIATE_STATE"
              python3 _engine/geo/parallel_unittest.py --jobs 3
              cd _engine/geo
              python3 outreach_scorecard.py --require-complete
            }
            export REMOTE_FIRST_RECONCILE_MESSAGE="Reconcile generated tree after origin merge"
            if ! remote_first_publish reconcile_english_phase origin main 5; then
              exit 1
            fi
          fi
      - name: Localize from curated dictionaries (zero-cost, no API)
        run: |
          source "$GITHUB_WORKSPACE/.github/scripts/bounded-resumable.sh"
          cd _engine/geo
          # 1) Recover translations already published inside localized pages back
          #    into the shared dictionaries. Free, no API, and every later page
          #    benefits from what earlier runs already translated.
          run_bounded_resumable 600 "i18n_harvest_existing" \
            python3 i18n_harvest_existing.py
          # 2) Create localized pages for slugs that still have none — all 50
          #    official locales, not just the 8 we used to cover.
          run_bounded_resumable 900 "new-page localization" \
            python3 aeo_answers_i18n.py \
              --trans i18n_trans \
              --limit 40
          # 3) Top up already-published pages the dictionaries can now localize
          #    better. --refresh only writes when the new render localizes more
          #    of the page, so a page can never regress, and the pass is
          #    resumable across runs. Without this step pages stayed frozen at
          #    whatever coverage existed the day they were first written.
          run_bounded_resumable 1200 "refresh localization" \
            python3 aeo_answers_i18n.py \
              --trans i18n_trans \
              --refresh --limit 300
          # 4) Publish the current per-locale body-localization scoreboard.
          python3 l10n_coverage.py --sample 40 \
            --json reports/l10n_coverage.json \
            --markdown reports/l10n_coverage.md
      - name: Fix EN hreflang reciprocity (declare newly-added locale versions)
        run: |
          cd _engine/geo
          python3 fix_en_hreflang.py
      - name: Add related-answers internal links (EN + major locales)
        run: |
          cd _engine/geo
          for loc in "" "--locale zh-Hant" "--locale zh-Hans" "--locale ja" "--locale ko" "--locale es-ES" "--locale es-MX" "--locale de-DE" "--locale fr-FR" "--locale pt-BR" "--locale ms" "--locale ar-SA" "--locale pl"; do
            python3 add_related_answers.py $loc
          done
      - name: Add Free-tools links to answer pages (root EN + all 50 official locales)
        run: |
          cd _engine/geo
          python3 add_related_tools.py --all-official-locales
      - name: Add related guidance to all 50 localized App detail pages
        run: |
          cd _engine/geo
          python3 gen_app_page_related.py
      - name: Final link and availability cleanup
        run: |
          cd _engine/geo
          python3 ensure_live_guides.py
          python3 gen_webstories.py
          python3 gen_webstories_i18n.py
          python3 gen_linkset.py
          python3 gen_social_previews.py
          python3 gen_image_sitemap.py
          python3 gen_mobile_app_identity.py
          python3 gen_webmcp_install_tools.py
          # Localization changes the answer text consumed by these catalogs.
          # Rebuild every dependent surface before sealing the tested tree.
          python3 portfolio_app_catalog_api.py
          python3 publisher_intent_catalog.py --today "$GEO_BUILD_DATE"
          python3 portfolio_offer_catalog.py --today "$GEO_BUILD_DATE"
          python3 publisher_intent_visuals.py --today "$GEO_BUILD_DATE"
          python3 app_video_lessons.py --today "$GEO_BUILD_DATE"
          python3 gen_social_previews.py --oembed-only
          python3 gen_github_discovery_readmes.py
          python3 gen_publisher_disclosures.py
          python3 gen_guide_design.py
          python3 gen_app_store_facts.py
          python3 normalize_app_store_links.py
          python3 app_install_decision_routes.py
          # ResourceSync must not recreate an unattributed store URL after the
          # final attribution pass.
          python3 zhuyin_resourcesync.py
          python3 gen_app_decision_cards.py
          # Full-tree cleanup 3/3 runs after every localized body generator.
          python3 cleanup_localized_assets.py --cached-live
          python3 gen_app_store_conversion_surfaces.py
          # Must stay after every generator that rewrites page bodies: those
          # emit clean store URLs, and this is what re-attaches ?pt&ct&mt.
          python3 gen_store_attribution.py
          python3 validate_webstories.py
          python3 gen_llms.py --cached-live
          python3 hero_tasks.py --today "$GEO_BUILD_DATE"
          python3 gen_feed.py
          cd "$GITHUB_WORKSPACE"
          python3 _engine/geo/sync_standard_site.py \
            --site-root "$GITHUB_WORKSPACE" \
            --contract-url "$STANDARD_SITE_GUIDE_CONTRACT_URL" \
            --allow-initial-404 \
            --timeout 10 \
            --retries 3 \
            --retry-delay 2
          python3 _engine/geo/reconcile_answer_semantics.py
          cd _engine/geo
          python3 live_app_guard.py --site-root pages
          # One inventory powers both passes. The second sitemap pass is
          # skipped only when the generated hub changes preserve the exact
          # indexable path + canonical URL set; convergence still runs.
          python3 dedupe_locale_meta.py --apply
          python3 high_intent_decision_routes.py \
            --inventory "$GITHUB_WORKSPACE/data/verified-ios-app-finder-catalog.json" \
            --output-dir "$GITHUB_WORKSPACE" \
            --materialize-current-inventory
          python3 close_sitemap_graph.py
          python3 publisher_intent_visuals.py --today "$GEO_BUILD_DATE"
          python3 gen_store_attribution.py
          python3 hero_tasks.py --today "$GEO_BUILD_DATE"
          python3 gen_feed.py
          python3 audit_link_depth.py --max-indexable-orphans 0
          python3 high_intent_decision_routes.py \
            --inventory "$GITHUB_WORKSPACE/data/verified-ios-app-finder-catalog.json" \
            --output-dir "$GITHUB_WORKSPACE" \
            --check-materialization-closure
          cd "$GITHUB_WORKSPACE"
          python3 _engine/geo/gen_sitemap_lastmod.py \
            --fallback-state "$SITEMAP_LASTMOD_INTERMEDIATE_STATE" \
            --today "$GEO_BUILD_DATE" \
            --workflow-started-at "$GEO_WORKFLOW_STARTED_AT"
      - name: Seal complete local-only hero results
        run: |
          python3 _engine/geo/hero_tasks.py --pages-dir "$GITHUB_WORKSPACE" --today "$GEO_BUILD_DATE"
          python3 _engine/geo/hero_tasks.py --pages-dir "$GITHUB_WORKSPACE" --today "$GEO_BUILD_DATE" --check
      - name: Verify localized output before commit
        run: |
          attestation="$RUNNER_TEMP/localized-verified-tree.json"
          rm -f "$attestation"
          python3 _engine/geo/verified_tree.py prepare \
            --root "$GITHUB_WORKSPACE" \
            --output "$attestation" \
            --suite geo-full-suite
          python3 _engine/geo/parallel_unittest.py --jobs 3
          python3 _engine/geo/verified_tree.py seal \
            --root "$GITHUB_WORKSPACE" \
            --output "$attestation" \
            --suite geo-full-suite
          echo "LOCALIZED_VERIFIED_TREE=$attestation" >> "$GITHUB_ENV"
      - name: Commit localized pages if any
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No localized changes."
          else
            git commit -m "Daily GEO content: localized answer pages"
            source .github/scripts/remote-first-publish.sh
            reconcile_localized_phase() {
              if python3 _engine/geo/verified_tree.py matches-head \
                --root "$GITHUB_WORKSPACE" \
                --output "$LOCALIZED_VERIFIED_TREE" \
                --suite geo-full-suite; then
                echo "Remote integration preserved the fully-tested content tree."
              else
                python3 _engine/geo/sync_standard_site.py \
                  --site-root "$GITHUB_WORKSPACE" \
                  --contract-url "$STANDARD_SITE_GUIDE_CONTRACT_URL" \
                  --allow-initial-404 \
                  --timeout 10 \
                  --retries 3 \
                  --retry-delay 2
                python3 _engine/geo/reconcile_answer_semantics.py
                cd _engine/geo
                python3 dedupe_locale_meta.py --apply
                python3 high_intent_decision_routes.py \
                  --inventory "$GITHUB_WORKSPACE/data/verified-ios-app-finder-catalog.json" \
                  --output-dir "$GITHUB_WORKSPACE" \
                  --materialize-current-inventory
                python3 close_sitemap_graph.py
                python3 publisher_intent_visuals.py --today "$GEO_BUILD_DATE"
                python3 gen_store_attribution.py
                python3 hero_tasks.py --today "$GEO_BUILD_DATE"
                python3 gen_feed.py
                python3 audit_link_depth.py --max-indexable-orphans 0
                python3 high_intent_decision_routes.py \
                  --inventory "$GITHUB_WORKSPACE/data/verified-ios-app-finder-catalog.json" \
                  --output-dir "$GITHUB_WORKSPACE" \
                  --check-materialization-closure
                cd "$GITHUB_WORKSPACE"
                python3 _engine/geo/gen_sitemap_lastmod.py \
                  --today "$GEO_BUILD_DATE" \
                  --workflow-started-at "$GEO_WORKFLOW_STARTED_AT"
                python3 _engine/geo/hero_tasks.py --pages-dir "$GITHUB_WORKSPACE" --today "$GEO_BUILD_DATE"
                python3 _engine/geo/hero_tasks.py --pages-dir "$GITHUB_WORKSPACE" --today "$GEO_BUILD_DATE" --check
                python3 _engine/geo/parallel_unittest.py --jobs 3
              fi
              cd _engine/geo
              python3 outreach_scorecard.py --require-complete
            }
            export REMOTE_FIRST_RECONCILE_MESSAGE="Reconcile localized tree after origin merge"
            if ! remote_first_publish reconcile_localized_phase origin main 5; then
              exit 1
            fi
          fi
      - name: Unlink site dir
        run: rm -f _engine/geo/pages
