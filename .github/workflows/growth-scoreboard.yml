name: Daily growth scoreboard

# 每天量測每款 App 在 50 個語系店面的評分數、母語關鍵字搜尋名次與類別排行榜，
# 把結果寫進 `growth-scoreboard` issue。只讀 Apple 公開 API，不碰 App Store
# Connect、不碰 App；被限流就提前停止並保存進度，下次自動接續。

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      search_budget:
        description: Native-keyword searches this run
        required: false
        default: "600"
      chart_budget:
        description: Category charts this run (about 450 covers every storefront and category daily)
        required: false
        default: "450"

permissions:
  actions: read # growth_records.py: is geo-daily running?
  contents: write # sprint-targets.json for the hook-clip scheduler
  issues: write

concurrency:
  group: growth-scoreboard
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read records still waiting on the growth-records-pending branch
        # geo-daily holds bot record pushes off main while it runs (growth_records.py);
        # dedupe and the promotion page read them from here until they are merged.
        run: python3 .github/scripts/growth_records.py overlay
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Restore scoreboard history
        uses: actions/cache/restore@v4
        with:
          path: .growth-scoreboard
          key: growth-scoreboard-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            growth-scoreboard-v1-
      - name: Verify scoreboard logic offline
        run: |
          python3 .github/scripts/test_growth_scoreboard.py
      - name: Measure public App Store outcomes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEARCH_BUDGET: ${{ inputs.search_budget || '600' }}
          CHART_BUDGET: ${{ inputs.chart_budget || '450' }}
        run: |
          python3 .github/scripts/growth_scoreboard.py \
            --state .growth-scoreboard/state.json \
            --report .growth-scoreboard/report.md \
            --json-out .growth-scoreboard/scoreboard.json \
            --sprint-out .github/growth/sprint-targets.json \
            --search-budget "$SEARCH_BUDGET" \
            --chart-budget "$CHART_BUDGET" \
            --issue
          cat .growth-scoreboard/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish sprint targets for the hook-clip scheduler
        if: success() && hashFiles('.github/growth/sprint-targets.json') != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }} # growth_records.py checks whether geo-daily is running
        run: |
          cp .github/growth/sprint-targets.json "$RUNNER_TEMP/sprint-targets.json"
          for i in 1 2 3; do
            target="$(python3 .github/scripts/growth_records.py prepare)"
            cp "$RUNNER_TEMP/sprint-targets.json" .github/growth/sprint-targets.json
            git add .github/growth/sprint-targets.json
            git diff --cached --quiet && exit 0
            git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "成績單：小國衝榜目標更新 [skip ci]"
            if python3 .github/scripts/growth_records.py push "$target"; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1
      - name: Save scoreboard history
        if: always() && hashFiles('.growth-scoreboard/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .growth-scoreboard
          key: growth-scoreboard-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep full measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-scoreboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: .growth-scoreboard/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90
