name: Daily IndexNow refresh

on:
  schedule:
    - cron: "47 4 * * *"    # 每天 2 次通知 Bing/Yandex/Naver 重抓(離峰,全天保持新鮮)
    - cron: "47 16 * * *"
    - cron: "17 5 1 * *"    # 每月公平重送完整長尾 locale inventory
  workflow_run:
    workflows: ["Deploy static site to Pages"]  # 只通知已部署且通過 CDN 驗證的 tree
    types: [completed]
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Submit every sitemap URL instead of only changed URLs
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false
  queue: max

jobs:
  ping:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin exact deployed source tree
        env:
          DEPLOYMENT_MANIFEST_URL: >-
            https://alice51849.github.io/ios-app-guide/.well-known/deployment.json
        run: |
          deployed_sha=""
          for attempt in {1..20}; do
            deployed_sha="$(
              curl -fsS --retry 2 --retry-all-errors \
                --connect-timeout 10 --max-time 20 \
                "${DEPLOYMENT_MANIFEST_URL}?run=${GITHUB_RUN_ID}-${attempt}" \
              | jq -er '.source_commit' 2>/dev/null || true
            )"
            if [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            sleep 10
          done
          [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${deployed_sha}^{commit}"
          git checkout --detach "$deployed_sha"
          test "$(git rev-parse HEAD)" = "$deployed_sha"
          python3 _engine/geo/live_app_guard.py --site-root .
      - name: Restore durable IndexNow state
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state
          key: indexnow-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-state-v1-
      - name: Verify strict IndexNow delivery
        run: python3 _engine/geo/tests/test_indexnow_submit.py
      - name: Submit changed public URLs to IndexNow
        run: |
          state_file=".indexnow-state/last-submitted-sha"
          receipt_file=".indexnow-state/accepted-receipt.json"
          # 只有「可索引內容」真的變了才通知。每日重建會改寫每頁的 head
          # 管線(hreflang、JSON-LD dateModified、build 指紋),實測 75-78%
          # 的「已變更」頁面可見文字一字未動;把那些送去 IndexNow 只會讓
          # 這個站的通知被當成雜訊。
          content_state=".indexnow-state/content-digests.json"
          keyfile="$(find . -maxdepth 1 -type f -name '*.txt' \
            | grep -E '/[a-f0-9]{32}\.txt$' | head -1)"
          test -n "$keyfile"
          mode=(--git-since "25 hours ago")
          if [[ "${{ github.event.schedule }}" == "17 5 1 * *" \
            || "${{ inputs.full_refresh || false }}" == "true" ]]; then
            mode=()
          fi
          python3 _engine/geo/indexnow_submit.py \
            --pages-dir . \
            --site https://open.cait518.cc/ios-app-guide \
            --key-file "$keyfile" \
            --key-location "https://open.cait518.cc/ios-app-guide/$(basename "$keyfile")" \
            --batch-size 10000 \
            --state-file "$state_file" \
            --receipt-file "$receipt_file" \
            --content-state "$content_state" \
            "${mode[@]}"
      - name: Preserve accepted delivery receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-accepted-${{ github.run_id }}-${{ github.run_attempt }}
          path: .indexnow-state/accepted-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Save durable IndexNow state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state
          key: indexnow-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
