name: Daily IndexNow refresh

on:
  schedule:
    - cron: "47 4 * * *"    # 每天 2 次通知 Bing/Yandex/Naver 重抓(離峰,全天保持新鮮)
    - cron: "47 16 * * *"
  workflow_run:
    workflows: ["Daily GEO content"]   # 每次內容生成後即通知搜尋引擎(排程不可靠時的確定性觸發)
    types: [completed]
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Submit every sitemap URL instead of only changed URLs
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore durable IndexNow state
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state
          key: indexnow-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-state-v1-
      - name: Verify strict IndexNow delivery
        run: python3 _engine/geo/tests/test_indexnow_submit.py
      - name: Submit changed public URLs to IndexNow
        run: |
          state_file=".indexnow-state/last-submitted-sha"
          keyfile="$(find . -maxdepth 1 -type f -name '*.txt' \
            | grep -E '/[a-f0-9]{32}\.txt$' | head -1)"
          test -n "$keyfile"
          mode=(--git-since "25 hours ago")
          if [[ "${{ inputs.full_refresh || false }}" == "true" ]]; then
            mode=()
          fi
          python3 _engine/geo/indexnow_submit.py \
            --pages-dir . \
            --site https://alice51849.github.io/ios-app-guide \
            --key-file "$keyfile" \
            --batch-size 10000 \
            --state-file "$state_file" \
            "${mode[@]}"
      - name: Save durable IndexNow state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state
          key: indexnow-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
