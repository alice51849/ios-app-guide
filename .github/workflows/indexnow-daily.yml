name: Daily IndexNow refresh

on:
  schedule:
    - cron: "47 4 * * *"    # 每天 2 次通知 Bing/Yandex/Naver 重抓(離峰,全天保持新鮮)
    - cron: "47 16 * * *"
  workflow_run:
    workflows: ["Daily GEO content"]   # 每次內容生成後即通知搜尋引擎(排程不可靠時的確定性觸發)
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify strict IndexNow delivery
        run: python3 _engine/geo/tests/test_indexnow_submit.py
      - name: Submit all sitemap URLs to IndexNow
        run: |
          keyfile="$(find . -maxdepth 1 -type f -name '*.txt' \
            | grep -E '/[a-f0-9]{32}\.txt$' | head -1)"
          test -n "$keyfile"
          python3 _engine/geo/indexnow_submit.py \
            --pages-dir . \
            --site https://alice51849.github.io/ios-app-guide \
            --key-file "$keyfile" \
            --batch-size 1000
