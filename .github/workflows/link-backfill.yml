name: Download link backfill

# Owner rule (2026-10-17): every promo post carries the app's direct download link. Instagram
# captions and Threads posts cannot be edited through the API, so the link goes in ONE comment /
# reply under OUR OWN post when it lacks one (link_backfill.py: only the token owner's media, once
# per post, newest first, a few per run, read back after writing, stops on a rate-limit answer).
#   mode=audit  lists which posts have / lack the link and writes the report, posts nothing.
#   mode=apply  adds the missing links (max_new per channel per run; `only` = a small first batch).
#   mode=diag   read-only look at what the platform answers about the posts in `only`.
# Dev.to articles can be edited, so there the text itself gets the link block (devto_link_fix.py).
# The schedule is the self-healing sweeper (detect a failure, fix it): it runs `apply` with a small
# max_new, and only once .github/growth/link-backfill.auto exists (the owner's switch for the sweeper).
# Report: .github/growth/link-backfill-report.json; receipts: .github/growth/link-backfill.json.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "audit (report only) or apply (add the links)"
        type: choice
        options:
          - audit
          - apply
          - diag
        default: "audit"
      max_new:
        description: "Links added per channel in this run"
        default: "3"
      only:
        description: "Only these post ids (space separated; empty = all)"
        default: ""
      channels:
        description: "instagram threads devto (space separated)"
        default: "instagram threads devto"

permissions:
  contents: read

concurrency:
  group: link-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # the report and the receipts are committed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a run that waited in the queue must see the receipts the run before it committed
      - name: Is the sweeper switched on?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ ! -f .github/growth/link-backfill.auto ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "sweeper is off (no .github/growth/link-backfill.auto)"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.x"
      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 .github/scripts/test_download_links.py -q
          python3 .github/scripts/test_link_backfill.py -q
          python3 .github/scripts/test_devto_link_fix.py -q
      - name: Audit / add the links
        id: sweep
        if: steps.gate.outputs.run == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          MODE: ${{ inputs.mode || 'apply' }}
          MAX_NEW: ${{ inputs.max_new || '2' }}
          ONLY: ${{ inputs.only }}
          CHANNELS: ${{ inputs.channels || 'instagram threads devto' }}
        run: |
          # the dispatch inputs are typed by a person: only numbers and the known channel names go further
          case "$MODE" in audit|apply|diag) ;; *) echo "::error::unknown mode"; exit 2;; esac
          case "$MAX_NEW" in ''|*[!0-9]*) echo "::error::max_new must be a number"; exit 2;; esac
          for p in $ONLY; do case "$p" in ''|*[!0-9]*) echo "::error::post ids are numbers"; exit 2;; esac; done
          SOCIAL=""; DEVTO=0
          for c in $CHANNELS; do case "$c" in instagram|threads) SOCIAL="$SOCIAL $c";; devto) DEVTO=1;; *) echo "::error::unknown channel"; exit 2;; esac; done
          echo "devto=$DEVTO" >> "$GITHUB_OUTPUT"
          set -o pipefail
          if [ -n "$SOCIAL" ]; then
            python3 .github/scripts/link_backfill.py "$MODE" --max-new "$MAX_NEW" --channels $SOCIAL ${ONLY:+--only $ONLY} | tee "$RUNNER_TEMP/backfill.log"
          else
            : > "$RUNNER_TEMP/backfill.log"
          fi
      - name: Dev.to articles
        if: steps.gate.outputs.run == 'true' && steps.sweep.outputs.devto == '1' && inputs.mode != 'diag' && inputs.only == ''
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          MODE: ${{ inputs.mode || 'apply' }}
          MAX_NEW: ${{ inputs.max_new || '2' }}
        run: |
          set -o pipefail
          python3 .github/scripts/devto_link_fix.py "$MODE" --max-new "$MAX_NEW" | tee -a "$RUNNER_TEMP/backfill.log"
      - name: Summary
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          { echo "### Download link backfill"; grep -E '^link_backfill |^devto_link_fix |^  (instagram|threads|devto) ' "$RUNNER_TEMP/backfill.log" | head -60; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save the reports and the receipts
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          G=.github/growth
          FILES="$G/link-backfill-report.json $G/link-backfill.json $G/devto-link-fix-report.json $G/devto-link-fix.json"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then echo "nothing new"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/save"
          for f in $FILES; do [ -f "$f" ] && cp -f "$f" "$RUNNER_TEMP/save/$(basename "$f")"; done
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            for r in link-backfill-report devto-link-fix-report; do
              [ -f "$RUNNER_TEMP/save/$r.json" ] && cp -f "$RUNNER_TEMP/save/$r.json" "$G/$r.json"
            done
            if [ -f "$RUNNER_TEMP/save/link-backfill.json" ]; then
              python3 .github/scripts/link_backfill.py merge --state-from "$RUNNER_TEMP/save/link-backfill.json"
            fi
            if [ -f "$RUNNER_TEMP/save/devto-link-fix.json" ]; then
              python3 -c "import sys; sys.path.insert(0, '.github/scripts'); import link_backfill as B, devto_link_fix as D; B.merge_state(sys.argv[1], D.STATE)" "$RUNNER_TEMP/save/devto-link-fix.json"
            fi
            for f in $FILES; do [ -f "$f" ] && git add "$f"; done
            git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "下載連結補齊紀錄 [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::warning::could not save the link backfill reports"; exit 1
