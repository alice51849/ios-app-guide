name: Download link backfill

# Owner rule (2026-10-17): every promo post carries the app's direct download link. Instagram
# captions and Threads posts cannot be edited through the API, so the link goes in ONE comment /
# reply under OUR OWN post when it lacks one (link_backfill.py: only the token owner's media, once
# per post, newest first, a few per run, read back after writing, stops on a rate-limit answer).
#   mode=audit  lists which posts have / lack the link and writes the report, posts nothing.
#   mode=apply  adds the missing links (max_new per channel per run; `only` = a small first batch).
# The schedule is the self-healing sweeper (detect a failure, fix it): it runs `apply` with a small
# max_new, and only once .github/growth/link-backfill.auto exists (the owner's switch for the sweeper).
# Report: .github/growth/link-backfill-report.json; receipts: .github/growth/link-backfill.json.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "audit (report only) or apply (add the links)"
        type: choice
        options:
          - audit
          - apply
          - diag
        default: "audit"
      max_new:
        description: "Links added per channel in this run"
        default: "3"
      only:
        description: "Only these post ids (space separated; empty = all)"
        default: ""
      channels:
        description: "instagram threads (space separated)"
        default: "instagram threads"

permissions:
  contents: read

concurrency:
  group: link-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # the report and the receipts are committed
    steps:
      - uses: actions/checkout@v4
      - name: Is the sweeper switched on?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ ! -f .github/growth/link-backfill.auto ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "sweeper is off (no .github/growth/link-backfill.auto)"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.x"
      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 .github/scripts/test_download_links.py -q
          python3 .github/scripts/test_link_backfill.py -q
      - name: Audit / add the links
        id: sweep
        if: steps.gate.outputs.run == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          MODE: ${{ inputs.mode || 'apply' }}
          MAX_NEW: ${{ inputs.max_new || '3' }}
          ONLY: ${{ inputs.only }}
          CHANNELS: ${{ inputs.channels || 'instagram threads' }}
        run: |
          # the dispatch inputs are typed by a person: only numbers and the two channel names go further
          case "$MODE" in audit|apply|diag) ;; *) echo "::error::unknown mode"; exit 2;; esac
          case "$MAX_NEW" in ''|*[!0-9]*) echo "::error::max_new must be a number"; exit 2;; esac
          for c in $CHANNELS; do case "$c" in instagram|threads) ;; *) echo "::error::unknown channel"; exit 2;; esac; done
          for p in $ONLY; do case "$p" in ''|*[!0-9]*) echo "::error::post ids are numbers"; exit 2;; esac; done
          set -o pipefail
          python3 .github/scripts/link_backfill.py "$MODE" --max-new "$MAX_NEW" --channels $CHANNELS ${ONLY:+--only $ONLY} | tee "$RUNNER_TEMP/backfill.log"
      - name: Summary
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          { echo "### Download link backfill"; grep -E '^link_backfill |^  (instagram|threads) ' "$RUNNER_TEMP/backfill.log" | head -60; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save the report and the receipts
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain -- .github/growth/link-backfill-report.json .github/growth/link-backfill.json)" ]; then echo "nothing new"; exit 0; fi
          cp .github/growth/link-backfill-report.json "$RUNNER_TEMP/report.json"
          cp -f .github/growth/link-backfill.json "$RUNNER_TEMP/state.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/state.json"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/report.json" .github/growth/link-backfill-report.json
            python3 .github/scripts/link_backfill.py merge --state-from "$RUNNER_TEMP/state.json"
            git add .github/growth/link-backfill-report.json .github/growth/link-backfill.json
            git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "下載連結補齊紀錄 [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::warning::could not save the link backfill report"; exit 1
