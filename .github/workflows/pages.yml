name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!_engine/**'
      # Readback contract fixes must ship without dispatching another GEO run.
      - '_engine/geo/deployment_generation.py'
      - '_engine/geo/hero_tasks_readback.py'
  workflow_run:
    workflows: ["Daily GEO content"]
    types: [completed]
  workflow_dispatch:
    inputs:
      incremental_high_intent:
        description: "只部署已驗證的 high-intent manifest 與變更索引"
        type: boolean
        default: false
      expected_guide_sha:
        description: "已驗證的 Guide commit（增量模式必填）"
        type: string
      expected_growth_sha:
        description: "已驗證且精確釘選 Guide 的 Growth commit（增量模式必填）"
        type: string
      previous_guide_revision:
        description: "計算受影響 sitemap/index 的已審 Guide 基線"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A failed/cancelled Daily GEO run creates a skipped workflow_run job. Give
  # that no-op event a unique group so it cannot cancel a valid push deploy.
  group: pages-${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[paired-high-intent]'))) && github.run_id || 'deploy' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[paired-high-intent]'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate paired incremental release
        if: inputs.incremental_high_intent == true
        env:
          EXPECTED_GUIDE_SHA: ${{ inputs.expected_guide_sha }}
          EXPECTED_GROWTH_SHA: ${{ inputs.expected_growth_sha }}
          PREVIOUS_GUIDE_REVISION: ${{ inputs.previous_guide_revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_GUIDE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_GROWTH_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIOUS_GUIDE_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.incremental_high_intent && inputs.expected_guide_sha || 'main' }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _engine/geo/requirements-validation.txt
      - name: Install canonical generator dependencies
        run: python3 -m pip install --requirement _engine/geo/requirements-validation.txt
      - name: Quarantine unavailable App Store pages
        if: inputs.incremental_high_intent != true
        run: python3 _engine/geo/live_app_guard.py --site-root .
      - name: Refuse pages that still identify themselves on the Pages origin
        if: inputs.incremental_high_intent != true
        run: python3 _engine/geo/audit_public_host_html.py --site-root .
      - name: Materialize and gate canonical discovery surfaces
        if: inputs.incremental_high_intent != true
        env:
          GEO_SITE: https://open.cait518.cc/ios-app-guide
          GEO_PAGES: ${{ github.workspace }}
          APP_STORE_PROVIDER_TOKEN: "118326163"
        run: |
          set -euo pipefail
          python3 _engine/geo/alternatives_i18n.py --pages-dir .
          python3 _engine/geo/alternatives_i18n.py --pages-dir . --check
          python3 _engine/geo/gen_hubs.py
          python3 _engine/geo/check_hub_coverage.py --pages-dir .
          python3 _engine/geo/gen_tool_email_capture.py
      - name: Prepare externally bound high-intent deployment
        env:
          # The route pages, manifest and deployment record this step writes are
          # public identifiers, so they must name the owned host, not the Pages
          # origin the deploy is later verified against.
          GEO_SITE: https://open.cait518.cc/ios-app-guide
          APP_STORE_PROVIDER_TOKEN: "118326163"
          GITHUB_TOKEN: ${{ github.token }}
          GROWTH_ENGINE_DEPLOY_KEY: ${{ secrets.GROWTH_ENGINE_DEPLOY_KEY }}
          INCREMENTAL_HIGH_INTENT: ${{ inputs.incremental_high_intent }}
          EXPECTED_GUIDE_SHA: ${{ inputs.expected_guide_sha }}
          EXPECTED_GROWTH_SHA: ${{ inputs.expected_growth_sha }}
          PREVIOUS_GUIDE_REVISION: ${{ inputs.previous_guide_revision }}
        run: |
          set -euo pipefail
          incremental_args=()
          if [[ "$INCREMENTAL_HIGH_INTENT" == "true" ]]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_GUIDE_SHA"
            git fetch --no-tags --depth=1 origin "$PREVIOUS_GUIDE_REVISION"
            incremental_args=(--incremental --previous-guide-revision "$PREVIOUS_GUIDE_REVISION")
          fi
          source_dir="$GITHUB_WORKSPACE/.high-intent-growth-source"
          key_file="$RUNNER_TEMP/growth-deploy-key-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          known_hosts="$RUNNER_TEMP/growth-known-hosts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_growth_source() {
            rm -f "$key_file" "$known_hosts"
            rm -rf "$source_dir"
          }
          trap cleanup_growth_source EXIT
          [[ ! -e "$source_dir" && ! -L "$source_dir" ]]
          umask 077
          printf '%s\n' "$GROWTH_ENGINE_DEPLOY_KEY" > "$key_file"
          unset GROWTH_ENGINE_DEPLOY_KEY
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/meta \
            | jq -er '.ssh_keys[] | "github.com " + .' > "$known_hosts"
          unset GITHUB_TOKEN
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          git clone --depth 1 --branch main --single-branch --no-tags \
            git@github.com:alice51849/00_GrowthEngine.git "$source_dir"
          if [[ "$INCREMENTAL_HIGH_INTENT" == "true" ]]; then
            git -C "$source_dir" fetch --no-tags --depth=1 origin "$EXPECTED_GROWTH_SHA"
            git -C "$source_dir" checkout --detach "$EXPECTED_GROWTH_SHA"
            test "$(git -C "$source_dir" rev-parse HEAD)" = "$EXPECTED_GROWTH_SHA"
            test "$(git -C "$source_dir" ls-tree HEAD geo/pages | awk '{print $3}')" = "$EXPECTED_GUIDE_SHA"
          fi
          unset GIT_SSH_COMMAND
          engine_revision="$(git -C "$source_dir" rev-parse HEAD)"
          rm -f "$key_file" "$known_hosts"
          python3 _engine/geo/deployment_generation.py prepare \
            --inventory "$GITHUB_WORKSPACE/data/verified-ios-app-finder-catalog.json" \
            --output-dir "$GITHUB_WORKSPACE" \
            --prepare-pages-deployment \
            --source-commit "$(git rev-parse HEAD)" \
            --current-source-root "$source_dir/geo" \
            --engine-source-revision "$engine_revision" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            "${incremental_args[@]}"
          rm -rf "$source_dir"
          trap - EXIT
      - name: Require complete local-only hero results before upload
        if: inputs.incremental_high_intent != true
        env:
          GEO_SITE: https://open.cait518.cc/ios-app-guide
          APP_STORE_PROVIDER_TOKEN: "118326163"
        # The high-intent prepare step above re-closes the sitemap graph, so
        # re-materialise the hero sitemap entry first; the check must then be
        # a no-op or the upload is refused.
        run: |
          python3 _engine/geo/hero_tasks.py --pages-dir .
          python3 _engine/geo/hero_tasks.py --pages-dir . --check
      - name: Gate evidenced native result images
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s _engine/geo/tests -p test_result_image_index.py -q
          python3 _engine/geo/result_image_index.py --pages .
          python3 _engine/geo/result_image_index.py --pages . --check
      - name: Preserve syndication notifiers and prune engine/tooling
        run: |
          cp _engine/geo/deployment_generation.py "$RUNNER_TEMP/deployment_generation.py"
          cp _engine/geo/notify_websub.py "$RUNNER_TEMP/notify_websub.py"
          cp _engine/geo/websub_config.py "$RUNNER_TEMP/websub_config.py"
          cp _engine/geo/official_locales.py "$RUNNER_TEMP/official_locales.py"
          cp _engine/geo/notify_rsscloud.py "$RUNNER_TEMP/notify_rsscloud.py"
          cp _engine/geo/rsscloud_config.py "$RUNNER_TEMP/rsscloud_config.py"
          cp _engine/geo/hero_tasks_readback.py "$RUNNER_TEMP/hero_tasks_readback.py"
          rm -rf _engine
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry transient CDN failure)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Verify exact deployment is live
        id: verify_live
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success')
        env:
          DEPLOYMENT_MANIFEST_URL: >-
            https://alice51849.github.io/ios-app-guide/.well-known/deployment.json
          GEO_SITE: https://open.cait518.cc/ios-app-guide
        run: |
          set -euo pipefail
          jq -e '.version == 4 and .app_count > 0 and .route_count > 0 and
            .fallback_records == 0 and
            .route_manifest_digest == .generation.manifest_digest' \
            .well-known/deployment.json > /dev/null
          test "$(git rev-parse HEAD)" = \
            "$(jq -er '.generation.pages_source_sha' .well-known/deployment.json)"
          python3 "$RUNNER_TEMP/deployment_generation.py" verify-live \
            --deployment .well-known/deployment.json \
            --site "${DEPLOYMENT_MANIFEST_URL%/.well-known/deployment.json}" \
            --site "$GEO_SITE" \
            --receipt "$RUNNER_TEMP/deployment-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            --attempts 30 \
            --retry-delay 25
          echo "Exact deployment is live: $(jq -er '.generation.generation_id' .well-known/deployment.json)"
      - name: Verify published result images without claiming indexing
        if: steps.verify_live.outcome == 'success'
        run: |
          set -euo pipefail
          git restore --source=HEAD -- \
            _engine/geo/result_image_index.py \
            _engine/geo/deployment_generation.py \
            _engine/geo/crawler_policy.py \
            _engine/geo/official_locales.py \
            _engine/geo/site_config.py \
            _engine/geo/data/result_image_evidence_v1.json
          python3 _engine/geo/result_image_index.py --pages . --check --verify-live \
            --report .result-image-reports/live-readback.json
      - name: Preserve result-image live readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-image-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: .result-image-reports/live-readback.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve generation-bound live readback
        if: always() && steps.verify_live.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-readback-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify every hero result on the public host
        id: verify_hero
        if: steps.verify_live.outcome == 'success' && inputs.incremental_high_intent != true
        timeout-minutes: 10
        run: >-
          python3 "$RUNNER_TEMP/hero_tasks_readback.py"
          --manifest "$GITHUB_WORKSPACE/data/hero-tasks/manifest.json"
          --base-url https://open.cait518.cc/ios-app-guide
      - name: Notify WebSub subscribers
        id: notify_websub
        if: >-
          always() &&
          inputs.incremental_high_intent != true &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success') &&
          steps.verify_live.outcome == 'success' &&
          steps.verify_hero.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEO_SITE: https://open.cait518.cc/ios-app-guide
        run: >-
          python3 "$RUNNER_TEMP/notify_websub.py"
          --feed-dir "$GITHUB_WORKSPACE"
      - name: Notify rssCloud subscribers
        id: notify_rsscloud
        if: >-
          always() &&
          inputs.incremental_high_intent != true &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success') &&
          steps.verify_live.outcome == 'success' &&
          steps.verify_hero.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEO_SITE: https://open.cait518.cc/ios-app-guide
        run: >-
          python3 "$RUNNER_TEMP/notify_rsscloud.py"
          --feed-dir "$GITHUB_WORKSPACE"
      - name: Enforce syndication notification results
        if: >-
          always() &&
          inputs.incremental_high_intent != true &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success') &&
          steps.verify_live.outcome == 'success' &&
          steps.verify_hero.outcome == 'success'
        run: |
          test "${{ steps.notify_websub.outcome }}" = "success"
          test "${{ steps.notify_rsscloud.outcome }}" = "success"
