name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '_engine/**'
  workflow_run:
    workflows: ["Daily GEO content"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout current Growth source
        uses: actions/checkout@v4
        with:
          repository: alice51849/00_GrowthEngine
          ref: main
          path: _engine/current-growth-source
          fetch-depth: 1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Quarantine unavailable App Store pages
        run: python3 _engine/geo/live_app_guard.py --site-root .
      - name: Prepare exact high-intent route release
        env:
          APP_STORE_PROVIDER_TOKEN: "118326163"
          GEO_PAGES: ${{ github.workspace }}
        run: |
          python3 _engine/geo/high_intent_decision_routes.py \
            --prepare-pages-deployment \
            --output-dir "$GITHUB_WORKSPACE" \
            --source-commit "$(git rev-parse HEAD)" \
            --current-source-root \
              "$GITHUB_WORKSPACE/_engine/current-growth-source/geo" \
            --engine-source-revision "$(
              git -C "$GITHUB_WORKSPACE/_engine/current-growth-source" \
                rev-parse HEAD
            )"
      - name: Verify allowlisted staging and artifact gates
        run: |
          python3 -m unittest -v \
            _engine.geo.tests.test_publish_inventory \
            _engine.geo.tests.test_pages_stage
          python3 -m unittest discover \
            -s .github/scripts \
            -p "test_pages_artifact_gate.py"
      - name: Build one post-guard allowlisted source tree
        run: |
          rm -rf \
            "${{ runner.temp }}/pages-allowlisted" \
            "${{ runner.temp }}/pages-publish"
          python3 _engine/geo/publish_inventory.py \
            --source "$GITHUB_WORKSPACE" \
            --output "${{ runner.temp }}/pages-allowlisted" \
            --source-commit "$(git rev-parse HEAD)"
      - name: Build semantically equivalent sub-900MB Pages tree
        run: >-
          python3 _engine/geo/pages_stage.py
          --source "${{ runner.temp }}/pages-allowlisted"
          --output "${{ runner.temp }}/pages-publish"
          --max-unpacked-bytes 870000000
      - name: Fail closed on pruned published source bytes and paths
        run: >-
          python3 .github/scripts/pages_artifact_gate.py tree
          --site-root "${{ runner.temp }}/pages-publish"
          --max-unpacked-bytes 870000000
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-publish
      - name: Verify exact Pages artifact before deployment
        run: >-
          python3 .github/scripts/pages_artifact_gate.py artifact
          --site-root "${{ runner.temp }}/pages-publish"
          --artifact "$RUNNER_TEMP/artifact.tar"
          --max-unpacked-bytes 870000000
          --max-deflate-upload-bytes 900000000
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry transient CDN failure)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Verify exact deployment is live
        id: verify_live
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success')
        env:
          STAGE_MANIFEST_URL: >-
            https://alice51849.github.io/ios-app-guide/.well-known/pages-stage-manifest.json.gz
        run: |
          expected="$(
            sha256sum \
              "${{ runner.temp }}/pages-publish/.well-known/pages-stage-manifest.json.gz" \
            | awk '{print $1}'
          )"
          for attempt in {1..30}; do
            live="$(
              curl -fsS --retry 2 --retry-all-errors \
                --connect-timeout 10 --max-time 20 \
                "${STAGE_MANIFEST_URL}?run=${GITHUB_RUN_ID}-${attempt}" \
              | sha256sum | awk '{print $1}' || true
            )"
            if [[ "$live" == "$expected" ]]; then
              echo "Exact post-guard deployment artifact is live: $live"
              exit 0
            fi
            sleep 10
          done
          echo "Expected deployment never reached the public CDN: $expected" >&2
          exit 1
      - name: Notify WebSub subscribers
        id: notify_websub
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success') &&
          steps.verify_live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEO_SITE: https://alice51849.github.io/ios-app-guide
        run: >-
          python3 _engine/geo/notify_websub.py
          --feed-dir "${{ runner.temp }}/pages-publish"
      - name: Notify rssCloud subscribers
        id: notify_rsscloud
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success') &&
          steps.verify_live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEO_SITE: https://alice51849.github.io/ios-app-guide
        run: >-
          python3 _engine/geo/notify_rsscloud.py
          --feed-dir "${{ runner.temp }}/pages-publish"
      - name: Enforce syndication notification results
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success') &&
          steps.verify_live.outcome == 'success'
        run: |
          test "${{ steps.notify_websub.outcome }}" = "success"
          test "${{ steps.notify_rsscloud.outcome }}" = "success"
