name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '_engine/**'
  workflow_run:
    workflows: ["Daily GEO content"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.run_attempt == 1)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download exact GEO publish evidence
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: geo-run-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/geo-upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Resolve exact source commit
        id: source
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            source_sha="$(
              tr -d '[:space:]' \
                < "$RUNNER_TEMP/geo-upstream/published-sha.txt"
            )"
          else
            source_sha="$GITHUB_SHA"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "PAGES_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - name: Verify pinned source commit
        run: test "$(git rev-parse HEAD)" = "$PAGES_SOURCE_SHA"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Quarantine unavailable App Store pages
        run: python3 _engine/geo/live_app_guard.py --site-root .
      - name: Write immutable deployment manifest
        run: |
          mkdir -p .well-known
          printf '{"version":1,"source_commit":"%s"}\n' \
            "$(git rev-parse HEAD)" > .well-known/deployment.json
      - name: Preserve syndication notifiers and prune engine/tooling
        run: |
          cp _engine/geo/notify_websub.py "$RUNNER_TEMP/notify_websub.py"
          cp _engine/geo/websub_config.py "$RUNNER_TEMP/websub_config.py"
          cp _engine/geo/official_locales.py "$RUNNER_TEMP/official_locales.py"
          cp _engine/geo/notify_rsscloud.py "$RUNNER_TEMP/notify_rsscloud.py"
          cp _engine/geo/rsscloud_config.py "$RUNNER_TEMP/rsscloud_config.py"
          rm -rf _engine
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry transient CDN failure)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Verify exact deployment is live
        id: verify_live
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success')
        env:
          DEPLOYMENT_MANIFEST_URL: >-
            https://alice51849.github.io/ios-app-guide/.well-known/deployment.json
        run: |
          expected="$(jq -er '.source_commit' .well-known/deployment.json)"
          for attempt in {1..30}; do
            live="$(
              curl -fsS --retry 2 --retry-all-errors \
                --connect-timeout 10 --max-time 20 \
                "${DEPLOYMENT_MANIFEST_URL}?run=${GITHUB_RUN_ID}-${attempt}" \
              | jq -er '.source_commit' 2>/dev/null || true
            )"
            if [[ "$live" == "$expected" ]]; then
              echo "Exact deployment is live: $live"
              exit 0
            fi
            sleep 10
          done
          echo "Expected deployment never reached the public CDN: $expected" >&2
          exit 1
      - name: Notify WebSub subscribers
        id: notify_websub
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success') &&
          steps.verify_live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEO_SITE: https://alice51849.github.io/ios-app-guide
        run: >-
          python3 "$RUNNER_TEMP/notify_websub.py"
          --feed-dir "$GITHUB_WORKSPACE"
      - name: Notify rssCloud subscribers
        id: notify_rsscloud
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success') &&
          steps.verify_live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEO_SITE: https://alice51849.github.io/ios-app-guide
        run: >-
          python3 "$RUNNER_TEMP/notify_rsscloud.py"
          --feed-dir "$GITHUB_WORKSPACE"
      - name: Enforce syndication notification results
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success') &&
          steps.verify_live.outcome == 'success'
        run: |
          test "${{ steps.notify_websub.outcome }}" = "success"
          test "${{ steps.notify_rsscloud.outcome }}" = "success"
