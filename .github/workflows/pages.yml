name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '_engine/**'
  workflow_run:
    workflows: ["Daily GEO content"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Preserve WebSub notifier and prune engine/tooling
        run: |
          cp _engine/geo/notify_websub.py "$RUNNER_TEMP/notify_websub.py"
          cp _engine/geo/websub_config.py "$RUNNER_TEMP/websub_config.py"
          rm -rf _engine
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry transient CDN failure)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Notify WebSub subscribers
        if: >-
          steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success'
        timeout-minutes: 6
        env:
          GEO_SITE: https://alice51849.github.io/ios-app-guide
        run: >-
          python3 "$RUNNER_TEMP/notify_websub.py"
          --feed-dir "$GITHUB_WORKSPACE"
