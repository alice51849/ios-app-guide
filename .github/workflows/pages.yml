name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '_engine/**'
  workflow_run:
    workflows: ["Daily GEO content"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A failed/cancelled Daily GEO run creates a skipped workflow_run job. Give
  # that no-op event a unique group so it cannot cancel a valid push deploy.
  group: pages-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || 'deploy' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Quarantine unavailable App Store pages
        run: python3 _engine/geo/live_app_guard.py --site-root .
      - name: Refuse pages that still identify themselves on the Pages origin
        run: python3 _engine/geo/audit_public_host_html.py --site-root .
      - name: Prepare externally bound high-intent deployment
        env:
          # The route pages, manifest and deployment record this step writes are
          # public identifiers, so they must name the owned host, not the Pages
          # origin the deploy is later verified against.
          GEO_SITE: https://open.cait518.cc/ios-app-guide
          APP_STORE_PROVIDER_TOKEN: "118326163"
          GITHUB_TOKEN: ${{ github.token }}
          GROWTH_ENGINE_DEPLOY_KEY: ${{ secrets.GROWTH_ENGINE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/.high-intent-growth-source"
          key_file="$RUNNER_TEMP/growth-deploy-key-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          known_hosts="$RUNNER_TEMP/growth-known-hosts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_growth_source() {
            rm -f "$key_file" "$known_hosts"
            rm -rf "$source_dir"
          }
          trap cleanup_growth_source EXIT
          [[ ! -e "$source_dir" && ! -L "$source_dir" ]]
          umask 077
          printf '%s\n' "$GROWTH_ENGINE_DEPLOY_KEY" > "$key_file"
          unset GROWTH_ENGINE_DEPLOY_KEY
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/meta \
            | jq -er '.ssh_keys[] | "github.com " + .' > "$known_hosts"
          unset GITHUB_TOKEN
          GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts" \
            git clone --depth 1 --branch main --single-branch --no-tags \
              git@github.com:alice51849/00_GrowthEngine.git "$source_dir"
          engine_revision="$(git -C "$source_dir" rev-parse HEAD)"
          rm -f "$key_file" "$known_hosts"
          python3 _engine/geo/deployment_generation.py prepare \
            --inventory "$GITHUB_WORKSPACE/data/verified-ios-app-finder-catalog.json" \
            --output-dir "$GITHUB_WORKSPACE" \
            --prepare-pages-deployment \
            --source-commit "$(git rev-parse HEAD)" \
            --current-source-root "$source_dir/geo" \
            --engine-source-revision "$engine_revision" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          rm -rf "$source_dir"
          trap - EXIT
      - name: Preserve syndication notifiers and prune engine/tooling
        run: |
          cp _engine/geo/deployment_generation.py "$RUNNER_TEMP/deployment_generation.py"
          cp _engine/geo/notify_websub.py "$RUNNER_TEMP/notify_websub.py"
          cp _engine/geo/websub_config.py "$RUNNER_TEMP/websub_config.py"
          cp _engine/geo/official_locales.py "$RUNNER_TEMP/official_locales.py"
          cp _engine/geo/notify_rsscloud.py "$RUNNER_TEMP/notify_rsscloud.py"
          cp _engine/geo/rsscloud_config.py "$RUNNER_TEMP/rsscloud_config.py"
          rm -rf _engine
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry transient CDN failure)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Verify exact deployment is live
        id: verify_live
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success')
        env:
          DEPLOYMENT_MANIFEST_URL: >-
            https://alice51849.github.io/ios-app-guide/.well-known/deployment.json
          GEO_SITE: https://open.cait518.cc/ios-app-guide
        run: |
          set -euo pipefail
          jq -e '.version == 4 and .app_count > 0 and .route_count > 0 and
            .fallback_records == 0 and
            .route_manifest_digest == .generation.manifest_digest' \
            .well-known/deployment.json > /dev/null
          test "$(git rev-parse HEAD)" = \
            "$(jq -er '.generation.pages_source_sha' .well-known/deployment.json)"
          python3 "$RUNNER_TEMP/deployment_generation.py" verify-live \
            --deployment .well-known/deployment.json \
            --site "${DEPLOYMENT_MANIFEST_URL%/.well-known/deployment.json}" \
            --site "$GEO_SITE" \
            --receipt "$RUNNER_TEMP/deployment-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            --attempts 30
          echo "Exact deployment is live: $(jq -er '.generation.generation_id' .well-known/deployment.json)"
      - name: Preserve generation-bound live readback
        if: always() && steps.verify_live.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-readback-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Notify WebSub subscribers
        id: notify_websub
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success') &&
          steps.verify_live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEO_SITE: https://open.cait518.cc/ios-app-guide
        run: >-
          python3 "$RUNNER_TEMP/notify_websub.py"
          --feed-dir "$GITHUB_WORKSPACE"
      - name: Notify rssCloud subscribers
        id: notify_rsscloud
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success') &&
          steps.verify_live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          GEO_SITE: https://open.cait518.cc/ios-app-guide
        run: >-
          python3 "$RUNNER_TEMP/notify_rsscloud.py"
          --feed-dir "$GITHUB_WORKSPACE"
      - name: Enforce syndication notification results
        if: >-
          always() &&
          (steps.deployment.outcome == 'success' ||
          steps.deployment_retry.outcome == 'success') &&
          steps.verify_live.outcome == 'success'
        run: |
          test "${{ steps.notify_websub.outcome }}" = "success"
          test "${{ steps.notify_rsscloud.outcome }}" = "success"
