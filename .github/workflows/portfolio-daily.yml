name: Daily Full Portfolio Coverage

on:
  schedule:
    # 12:30 in Taiwan: one complete, non-spammy daily portfolio digest.
    - cron: "30 4 * * *"
  workflow_run:
    workflows: ["Daily GEO content"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-full-portfolio
  cancel-in-progress: false

jobs:
  public-market-sla:
    # This job verifies the last deployed public matrix even when a GEO run
    # fails after preserving the prior known-good deployment.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Verify public market coverage regressions
        run: python3 .github/scripts/test_public_market_coverage.py -q -b
      - name: Verify all 46 Apps across all 50 Apple locales are public
        run: >-
          python3 .github/scripts/public_market_coverage.py
          --expected-apps 46
          --expected-locales 50
          --workers 10
          --report "$RUNNER_TEMP/public-market-coverage.json"
          --summary "$GITHUB_STEP_SUMMARY"

  telegram:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Verify social posting regressions
        run: python3 .github/scripts/test_social_posting.py -q -b
      - name: Publish every public app to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/portfolio_daily.py --platform telegram

  threads:
    # 停用(2026-08-18)。這個 job 用 repo secret `THREADS_TOKEN` 一次把全部
    # 公開 App 發成一份 Threads 日報,完全繞過 threads-autopilot 的
    # guardrails.py(新帳號爬坡、每小時 1 篇、每日 3 篇、隨機抖動)。
    # 舊 Threads 帳號正是死於「每天 30-48 篇、100% 帶商店連結」的畫像;
    # 帳號在 2026-08-10 重開後 secret 沒換,這個 job 從 2026-08-09 起每天
    # 以 OAuthException 190「invalid user id」失敗 —— 也就是說它已經 9 天
    # 沒有發出任何東西,只是每天把 workflow 染紅。
    # 姐妹 workflow `threads-daily.yml` 當時已被手動停用,這個 job 被漏掉。
    # Threads 只保留 threads-autopilot 一條受管控的通道;要重新啟用必須先
    # 讓這條路徑走 guardrails.py 的配額,不可只補上新 token。
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Verify social posting regressions
        run: python3 .github/scripts/test_social_posting.py -q -b
      - name: Publish every public app to Threads
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/portfolio_daily.py --platform threads
