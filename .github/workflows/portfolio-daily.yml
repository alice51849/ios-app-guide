name: Daily Full Portfolio Coverage

on:
  schedule:
    # 12:30 in Taiwan: one complete, non-spammy daily portfolio digest.
    - cron: "30 4 * * *"
  workflow_run:
    workflows: ["Daily GEO content"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-full-portfolio
  cancel-in-progress: false

jobs:
  telegram:
    # Manual, chained and future push triggers may run workflow diagnostics,
    # but this publisher job can never POST or write a daily marker for them.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_RECEIPT_STORE: data/telegram-public-receipts.json
      TELEGRAM_PUBLICATION_STATE: .telegram-publication-state/state.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # remote-first-publish.sh merges the live origin tip before pushing,
          # so the receipt commit needs real history, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Prepare run-scoped Telegram paths
        id: telegram_clock
        if: github.event_name == 'schedule'
        # `runner.temp` is not available to job-level env, and the batch must
        # live outside the repo tree so it can never be committed by accident.
        run: |
          echo "TELEGRAM_RECEIPT_PENDING=$RUNNER_TEMP/telegram-public-receipts-pending.json" \
            >> "$GITHUB_ENV"
          echo "utc_day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Verify social posting regressions
        run: python3 .github/scripts/test_social_posting.py -q -b
      - name: Verify fail-closed public exposure receipts
        run: python3 .github/scripts/test_telegram_public_receipts.py -q -b
      - name: Restore durable Telegram publication state
        id: restore_publication_state
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .telegram-publication-state
          key: >-
            telegram-publication-result-v1-${{
            steps.telegram_clock.outputs.utc_day }}-restore-${{
            github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            telegram-publication-result-v1-${{ steps.telegram_clock.outputs.utc_day }}-
            telegram-publication-reservation-v1-${{ steps.telegram_clock.outputs.utc_day }}-
      - name: Prepare durable Telegram publication reservation
        id: prepare_publication
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_PUBLICATION_CACHE_MATCHED: >-
            ${{ steps.restore_publication_state.outputs.cache-matched-key }}
        run: |
          if [ -f "$TELEGRAM_PUBLICATION_STATE" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          python3 .github/scripts/portfolio_daily.py \
            --platform telegram --telegram-phase prepare
      - name: Save durable Telegram publication reservation
        id: save_publication_reservation
        if: >-
          github.event_name == 'schedule' &&
          steps.prepare_publication.outputs.created == 'true'
        uses: actions/cache/save@v4
        with:
          path: .telegram-publication-state
          key: >-
            telegram-publication-reservation-v1-${{
            steps.telegram_clock.outputs.utc_day }}-${{
            github.run_id }}-${{ github.run_attempt }}-reservation
      - name: Publish every public app to Telegram
        id: publish_publication
        # A restored complete POST result skips this step entirely; that run
        # receives no bot credential and can only retry the public GET.
        if: >-
          github.event_name == 'schedule' &&
          steps.prepare_publication.outputs.created == 'true' &&
          steps.save_publication_reservation.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PUBLICATION_RESERVATION_PERSISTED: "true"
        run: >-
          python3 .github/scripts/portfolio_daily.py
          --platform telegram --telegram-phase publish
      - name: Save durable Telegram publication result
        id: save_publication_result
        # Save partial state after a failed send too. If this save fails, the
        # pre-POST reservation still makes every later run fail closed.
        if: >-
          always() && github.event_name == 'schedule' &&
          steps.prepare_publication.outputs.created == 'true' &&
          steps.save_publication_reservation.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .telegram-publication-state
          key: >-
            telegram-publication-result-v1-${{
            steps.telegram_clock.outputs.utc_day }}-${{
            github.run_id }}-${{ github.run_attempt }}-result
      - name: Verify published Telegram messages
        if: >-
          always() && github.event_name == 'schedule' &&
          steps.prepare_publication.outcome == 'success' &&
          ((steps.prepare_publication.outputs.created == 'true' &&
          steps.publish_publication.outcome == 'success' &&
          steps.save_publication_result.outcome == 'success') ||
          (steps.prepare_publication.outputs.created != 'true' &&
          steps.publish_publication.outcome == 'skipped'))
        run: >-
          python3 .github/scripts/portfolio_daily.py
          --platform telegram --telegram-phase verify
      - name: Commit public exposure receipts
        # Runs even when verification failed so the durable "not counted"
        # reason is published instead of dying with the red job.
        if: always() && github.event_name == 'schedule'
        run: |
          if [ ! -f "$TELEGRAM_RECEIPT_PENDING" ]; then
            echo "no receipt batch to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit before merging: remote-first-publish.sh integrates the live
          # origin tip with `git merge`, which refuses to run on a dirty tree.
          git add -- "$TELEGRAM_RECEIPT_STORE"
          if ! git diff --cached --quiet; then
            git commit -m "Record public Telegram exposure receipts"
          fi
          source .github/scripts/remote-first-publish.sh
          reconcile_public_receipts() {
            # Re-merge after every remote integration: a concurrent writer on
            # main must never drop a receipt through conflict resolution.
            python3 .github/scripts/telegram_public_receipts.py \
              --store "$TELEGRAM_RECEIPT_STORE" \
              --merge-pending "$TELEGRAM_RECEIPT_PENDING"
          }
          export REMOTE_FIRST_RECONCILE_MESSAGE="Record public Telegram exposure receipts"
          if ! remote_first_publish reconcile_public_receipts origin main 5; then
            exit 1
          fi

  threads:
    # 停用(2026-08-18)。這個 job 用 repo secret `THREADS_TOKEN` 一次把全部
    # 公開 App 發成一份 Threads 日報,完全繞過 threads-autopilot 的
    # guardrails.py(新帳號爬坡、每小時 1 篇、每日 3 篇、隨機抖動)。
    # 舊 Threads 帳號正是死於「每天 30-48 篇、100% 帶商店連結」的畫像;
    # 帳號在 2026-08-10 重開後 secret 沒換,這個 job 從 2026-08-09 起每天
    # 以 OAuthException 190「invalid user id」失敗 —— 也就是說它已經 9 天
    # 沒有發出任何東西,只是每天把 workflow 染紅。
    # 姐妹 workflow `threads-daily.yml` 當時已被手動停用,這個 job 被漏掉。
    # Threads 只保留 threads-autopilot 一條受管控的通道;要重新啟用必須先
    # 讓這條路徑走 guardrails.py 的配額,不可只補上新 token。
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Verify social posting regressions
        run: python3 .github/scripts/test_social_posting.py -q -b
      - name: Publish every public app to Threads
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/portfolio_daily.py --platform threads
