name: Social extra daily

# Zero-token daily posts of the hook clips (clips.json, mirrored from that
# day's Instagram/Threads/Telegram schedule) and the day's countdown/utility
# cards to nine more platforms, by .github/scripts/social_extra.py. Every post
# goes in .github/growth/clip-posts.json (a clip never goes to the same
# platform twice) and its link onto office.cait518.cc.
#
# Each platform is secret-gated: without its secrets the run logs
# "not configured" and carries on; a platform error never fails the workflow.
# Secrets (repository → Settings → Secrets and variables → Actions):
#   Facebook Page  FB_PAGE_ID, FB_PAGE_TOKEN  (without them the IG_ACCESS_TOKEN
#                  secret is probed via /me/accounts for a Page token with
#                  CREATE_CONTENT; the log names the Page it uses)
#   Bluesky        BSKY_HANDLE, BSKY_APP_PASSWORD
#   YouTube Shorts YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN
#                  (uploads stay private until the API project passes audit)
#   Pinterest      PINTEREST_TOKEN, optional PINTEREST_REFRESH_TOKEN +
#                  PINTEREST_APP_ID + PINTEREST_APP_SECRET, optional
#                  PINTEREST_BOARD_ID (default: find/create board "Lumi Apps")
#   Tumblr         TUMBLR_CONSUMER_KEY, TUMBLR_CONSUMER_SECRET, TUMBLR_TOKEN,
#                  TUMBLR_TOKEN_SECRET, TUMBLR_BLOG
#   Naver Blog     NAVER_ID, NAVER_BLOG_API_PASSWORD   (Korean only, 1/day)
#   Plurk          PLURK_APP_KEY, PLURK_APP_SECRET, PLURK_TOKEN,
#                  PLURK_TOKEN_SECRET                  (zh-Hant only, ≤2/day)
#   Dailymotion    DM_API_KEY, DM_API_SECRET, DM_USERNAME, DM_PASSWORD (1/day)
#                  (paid per post: 1/day)
# Bluesky is posted by threads-autopilot (media.yml) and YouTube Shorts by the
# Mac (00_GrowthEngine hook-shorts-youtube.yml), both from this run's feed.json
# on the social-feed branch (the day's items plus a ranked clip pool);
# social_extra.py skips them here unless FORCE_GUIDE_BLUESKY=1 /
# FORCE_GUIDE_YOUTUBE=1 is set, so secrets added here cannot double-post.
# Manual run: mode=whoami checks every configured account without posting;
# dry_run=true prints what would go out.
# run-name records the slot's cron (also on a catch-up the Mac's cron dispatcher,
# 00_GrowthEngine tools/cron_dispatcher, starts when GitHub dropped the cron), so
# social_slot_gate.py and the dispatcher tell which slot a run was for however
# late it started.
run-name: >-
  ${{ (github.event.schedule || inputs.cron)
  && format('Social extra daily · cron {0}', github.event.schedule || inputs.cron)
  || 'Social extra daily' }}
on:
  schedule:
    - cron: "50 1 * * *"   # slot 1: after the Asia-morning clip posts
    - cron: "50 15 * * *"  # slot 15: Americas morning, plus the day's cards
  workflow_dispatch:
    inputs:
      channel:
        description: "Platform (all, facebook, bluesky, youtube, pinterest, tumblr, naver, plurk, dailymotion, misskey, pixelfed, telegraph, writeas, hatena, wordpress, blogger, whitewind; comma list ok)"
        default: "all"
      mode:
        description: "post or whoami"
        type: choice
        options: [post, whoami]
        default: post
      dry_run:
        description: "Print what would be posted, post nothing"
        type: boolean
        default: false
      slot:
        description: "clips.json slot (1 or 15); auto = by UTC hour"
        default: "auto"
      cron:
        description: "Cron dispatcher only: the missed schedule this run replaces, e.g. 50 1 * * *; runs like that scheduled run, slot gate included"
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: social-extra
  cancel-in-progress: false

jobs:
  post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write # records each post's link on the promotion page
    steps:
      - uses: actions/checkout@v4
      - name: Read records still waiting on the growth-records-pending branch
        # geo-daily holds bot record pushes off main while it runs (growth_records.py);
        # dedupe and the promotion page read them from here until they are merged.
        run: python3 .github/scripts/growth_records.py overlay
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Prevent duplicate UTC slot
        id: slot
        if: github.event_name == 'schedule' || inputs.cron != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOT_SCHEDULE: ${{ github.event.schedule || inputs.cron }}
        run: >-
          python3 .github/scripts/social_slot_gate.py
          --workflow social-extra.yml
          --slots 1,15
          --schedule "$SLOT_SCHEDULE"
      - name: Test
        run: |
          pip install -q pillow
          python3 .github/scripts/test_social_extra.py -q
      - name: Post
        if: (github.event_name == 'workflow_dispatch' && inputs.cron == '') || steps.slot.outputs.should_post == 'true'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          TUMBLR_BLOG: ${{ secrets.TUMBLR_BLOG }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_BLOG_API_PASSWORD: ${{ secrets.NAVER_BLOG_API_PASSWORD }}
          PLURK_APP_KEY: ${{ secrets.PLURK_APP_KEY }}
          PLURK_APP_SECRET: ${{ secrets.PLURK_APP_SECRET }}
          PLURK_TOKEN: ${{ secrets.PLURK_TOKEN }}
          PLURK_TOKEN_SECRET: ${{ secrets.PLURK_TOKEN_SECRET }}
          DM_API_KEY: ${{ secrets.DM_API_KEY }}
          DM_API_SECRET: ${{ secrets.DM_API_SECRET }}
          DM_USERNAME: ${{ secrets.DM_USERNAME }}
          DM_PASSWORD: ${{ secrets.DM_PASSWORD }}
          # 2026-10-22 platform 50 (social_extra.py; the Mac sets these, 00_GrowthEngine ops/handoff/LOCAL_QUEUE_2026-10-22_platform50.md)
          MISSKEY_HOST: ${{ secrets.MISSKEY_HOST }}
          MISSKEY_TOKEN: ${{ secrets.MISSKEY_TOKEN }}
          PIXELFED_HOST: ${{ secrets.PIXELFED_HOST }}
          PIXELFED_TOKEN: ${{ secrets.PIXELFED_TOKEN }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          WRITEAS_TOKEN: ${{ secrets.WRITEAS_TOKEN }}
          WRITEAS_BLOG: ${{ secrets.WRITEAS_BLOG }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          WPCOM_SITE: ${{ secrets.WPCOM_SITE }}
          WPCOM_TOKEN: ${{ secrets.WPCOM_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          SCHEDULE: ${{ github.event.schedule || inputs.cron }}
          CHANNEL: ${{ inputs.channel }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_SLOT: ${{ inputs.cron == '' && inputs.slot || '' }}
        run: |
          SLOT="${MANUAL_SLOT:-$(echo "$SCHEDULE" | awk '{print $2}')}"
          python3 .github/scripts/social_extra.py "${MODE:-post}" --channel "${CHANNEL:-all}" --slot "${SLOT:-auto}" \
            $([ "$DRY_RUN" = "true" ] && echo --dry-run) || echo "::warning::social_extra.py exited with an error"
      # threads-autopilot (Bluesky, Mastodon) and the Mac (YouTube) read the
      # day's items from raw.githubusercontent.com/<repo>/social-feed/feed.json,
      # so their secrets never have to be copied here. Plain data, no secrets;
      # a normal (never forced) push onto the data branch.
      - name: Publish the day's items on the social-feed branch
        continue-on-error: true
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          python3 .github/scripts/social_extra.py export --out "$RUNNER_TEMP/feed.json"
          W="$RUNNER_TEMP/social-feed"
          for i in 1 2 3; do
            rm -rf "$W"; git worktree prune
            if git fetch -q --depth 1 origin social-feed 2>/dev/null; then
              git worktree add -q --detach "$W" FETCH_HEAD
            else
              git worktree add -q --detach "$W" && git -C "$W" checkout -q --orphan social-feed && git -C "$W" rm -rqf --ignore-unmatch .
            fi
            cp "$RUNNER_TEMP/feed.json" "$W/feed.json"
            git -C "$W" add feed.json
            if git -C "$W" diff --cached --quiet; then echo "feed unchanged"; exit 0; fi
            git -C "$W" -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "social feed $(date -u +%F) [skip ci]"
            if git -C "$W" push -q "$PUSH_URL" HEAD:refs/heads/social-feed; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::warning::could not publish feed.json"; exit 1
      - name: Record the post links on the promotion page
        if: (github.event_name == 'workflow_dispatch' && inputs.cron == '') || steps.slot.outputs.should_post == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }} # growth_records.py checks whether geo-daily is running
        run: |
          if [ -z "$(git status --porcelain -- .github/growth/clip-posts.json)" ]; then echo "nothing posted"; exit 0; fi
          cp .github/growth/clip-posts.json "$RUNNER_TEMP/clip-posts.json"
          for i in 1 2 3; do
            target="$(python3 .github/scripts/growth_records.py prepare)"
            python3 .github/scripts/clip_progress.py --merge-log "$RUNNER_TEMP/clip-posts.json"
            git add .github/growth/clip-posts.json .github/growth/app-improvements.json
            git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "多平台發文紀錄：外宣頁連結更新 [skip ci]"
            if python3 .github/scripts/growth_records.py push "$target"; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::warning::could not record the posts"; exit 1
