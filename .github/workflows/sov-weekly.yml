name: Weekly zero-cost outreach coverage

on:
  schedule:
    - cron: "13 4 * * 1"   # 每週一 04:13 UTC 追蹤各大 LLM 是否推薦你的 App
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-app-guide-main-writer
  cancel-in-progress: false
  queue: max

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Link site dir into engine layout
        run: |
          rm -rf _engine/geo/pages
          ln -s "$GITHUB_WORKSPACE" _engine/geo/pages
      - name: Measure factual owned-asset coverage
        run: python3 _engine/geo/outreach_scorecard.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _engine/geo/reports
          if git diff --cached --quiet; then
            echo "No coverage changes."
          else
            git commit -m "Weekly zero-cost outreach coverage [skip deploy]"
            source .github/scripts/remote-first-publish.sh
            reconcile_sov_phase() {
              python3 _engine/geo/outreach_scorecard.py
            }
            export REMOTE_FIRST_RECONCILE_MESSAGE="Reconcile weekly outreach coverage after origin merge"
            if ! remote_first_publish reconcile_sov_phase origin main 5; then
              exit 1
            fi
          fi
