name: Weekly AI visibility (share-of-voice)

on:
  schedule:
    - cron: "13 4 * * 1"   # 每週一 04:13 UTC 追蹤各大 LLM 是否推薦你的 App
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sov-weekly
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    env:
      OPENAI_MODEL: gpt-4o-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision OpenAI key
        run: printf '%s' "${{ secrets.OPENAI_KEY }}" > "$HOME/.openai_key"
      - name: Measure AI share-of-voice (all apps)
        run: |
          cd _engine/geo
          python3 aeo_sov.py || echo "aeo_sov exited $?"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _engine/geo/reports
          if git diff --cached --quiet; then
            echo "No SOV changes."
          else
            git commit -m "Weekly AI share-of-voice report [skip deploy]"
            git push
          fi
