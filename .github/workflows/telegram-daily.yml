name: Telegram daily post

on:
  schedule:
    - cron: "0 1 * * *"    # 09:00 台灣 / 亞洲早
    - cron: "0 9 * * *"    # 歐洲早 / 中東
    - cron: "0 15 * * *"   # 美洲
  workflow_dispatch:        # 可手動觸發(測試用)

permissions:
  actions: read
  contents: read

concurrency:
  group: telegram-daily-social
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      ASC_GROWTH_SIGNALS_B64: ${{ secrets.ASC_GROWTH_SIGNALS_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Prevent duplicate UTC slot
        id: slot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/social_slot_gate.py
          --workflow telegram-daily.yml
          --slots 1,9,15
      - name: Verify social automation
        if: steps.slot.outputs.should_post == 'true'
        run: |
          python3 .github/scripts/test_social_slot_gate.py -q
          python3 .github/scripts/test_social_posting.py -q
      - name: Post to Telegram channel (free, no OpenAI)
        if: steps.slot.outputs.should_post == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/telegram_post.py
