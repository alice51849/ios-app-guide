name: Telegram daily post

on:
  schedule:
    - cron: "0 1 * * *"    # 09:00 台灣 / 亞洲早
    - cron: "0 9 * * *"    # 歐洲早 / 中東
    - cron: "0 15 * * *"   # 美洲
  # 僅由自然 slot 發文；本機／feature branch 只跑 --self-test。

permissions:
  actions: read
  contents: read

concurrency:
  group: telegram-daily-social
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      should_post: ${{ steps.slot.outputs.should_post }}
    permissions:
      actions: read
      contents: write # telegram-native-ledger 孤立資料分支的 CAS 寫入，與鉤子片發文紀錄。
      issues: write   # volume_ramp.py：Telegram 回限流時開 volume-throttle issue
    env:
      ASC_GROWTH_SIGNALS_B64: ${{ secrets.ASC_GROWTH_SIGNALS_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Prevent duplicate UTC slot
        id: slot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/social_slot_gate.py
          --workflow telegram-daily.yml
          --slots 1,9,15
      - name: Verify social automation
        if: steps.slot.outputs.should_post == 'true'
        run: |
          mkdir -p .tel-test-work
          export TMPDIR="$GITHUB_WORKSPACE/.tel-test-work"
          python3 .github/scripts/telegram_post.py --self-test
          python3 .github/scripts/test_social_slot_gate.py -q
          python3 .github/scripts/test_social_posting.py -q -b
      - name: Post to Telegram channel (free, no OpenAI)
        if: steps.slot.outputs.should_post == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SLOT: ${{ steps.slot.outputs.slot }}
          TELEGRAM_SCHEDULE: ${{ github.event.schedule }}
        run: python3 .github/scripts/telegram_post.py
      - name: Post today's 7-second hook clip (video + App Store button)
        # Asia morning (zh-Hant / ja / ko), Europe (de / fr / es / en) and Americas (en)
        # slots, as planned in clips.json by schedule_posts.py; a clip problem never
        # fails the daily post above.
        if: steps.slot.outputs.should_post == 'true' && (github.event.schedule == '0 1 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 15 * * *')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 .github/scripts/test_volume_ramp.py -q
          python3 .github/scripts/test_clip_posts.py -q
          python3 .github/scripts/clip_posts.py telegram --slot "$(echo "$SCHEDULE" | awk '{print $2}')"
      - name: Record the post link on the promotion page (and any throttle)
        # office.cait518.cc lists every clip post; clip_posts.py wrote the
        # link to clip-posts.json and refreshed app-improvements.json; a
        # volume_ramp.py throttle lands in volume-ramp.json.
        if: steps.slot.outputs.should_post == 'true' && (github.event.schedule == '0 1 * * *' || github.event.schedule == '0 9 * * *' || github.event.schedule == '0 15 * * *')
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain -- .github/growth/clip-posts.json .github/growth/volume-ramp.json)" ]; then echo "nothing posted"; exit 0; fi
          cp .github/growth/clip-posts.json "$RUNNER_TEMP/clip-posts.json"
          cp .github/growth/volume-ramp.json "$RUNNER_TEMP/volume-ramp.json"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 .github/scripts/clip_progress.py --merge-log "$RUNNER_TEMP/clip-posts.json"
            python3 .github/scripts/volume_ramp.py --merge "$RUNNER_TEMP/volume-ramp.json"
            git add .github/growth/clip-posts.json .github/growth/app-improvements.json .github/growth/volume-ramp.json
            git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "鉤子片發文紀錄：外宣頁連結更新 [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::warning::could not record the clip post"; exit 1
      - name: Preserve native response and ledger recovery evidence
        if: always() && steps.slot.outputs.should_post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-native-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: .telegram-ledger-run/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

  catalog:
    # 每日全 App 目錄(portfolio_daily.py):全部上架 App 依類別列出，每款一條
    # 帶 ct=soc_tg_digest 的 App Store 連結，超過長度自動拆成多則。
    # 每個時段都試一次，但同一個 UTC 日只發一次：portfolio_daily 先查
    # telegram-daily 的 catalog job 與 portfolio-daily 的 telegram job 今天
    # 是否已成功，成功過就直接略過。漏一班由下一個時段補上。
    needs: post
    if: >-
      always()
      && github.event_name == 'schedule'
      && github.ref == 'refs/heads/main'
      && needs.post.outputs.should_post == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # 與 portfolio-daily 的 telegram job 共用，兩邊不會同時判斷「今天還沒發」。
      group: telegram-portfolio-digest
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify social posting regressions
        run: python3 .github/scripts/test_social_posting.py -q -b
      - name: Post today's all-App catalog (once per UTC day)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/portfolio_daily.py --platform telegram
