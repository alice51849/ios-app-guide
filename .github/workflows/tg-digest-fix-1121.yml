name: tg-digest-fix-1121 (one-off)
# 一次性：改正 11-21 已發五則 Telegram「每日全 App 精選」的語言數句（統籌第 92 項第 4 點③；業主 11-21 同意用流程跑）。跑完即移除本檔。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: write script
        run: |
          cat > /tmp/tg_digest_fix_1121.py <<'PY'
          import html, json, re, sys, urllib.parse, urllib.request
          OLD = "🌏 每款都支援 50 種語言，App 內一鍵切換、不必改手機語言：家人用中文、看護用印尼文或越南文、孩子用英文，同一支手機各用各的。"
          NEW = "🌏 每款 App Store 版都支援 40 種以上語言。"
          IDS = (766, 767, 768, 769, 770)
          apply = "--apply" in sys.argv
          def text_of(mid):
              page = urllib.request.urlopen(f"https://t.me/LumiApps2026/{mid}?embed=1&mode=tme", timeout=30).read().decode("utf-8")
              m = re.search(r'<div class="tgme_widget_message_text[^"]*"[^>]*>(.*?)</div>', page, re.S)
              if not m:
                  sys.exit(f"STOP {mid}: 讀不到訊息內文")
              raw = re.sub(r"<br\s*/?>", "\n", m.group(1))
              return html.unescape(re.sub(r"<[^>]+>", "", raw))
          for mid in IDS:
              text = text_of(mid)
              n = text.count(OLD)
              if NEW in text and n == 0 and "App 內一鍵切換" not in text and "各用各的" not in text:
                  print(f"SKIP {mid}: 已改過"); continue
              if n != 1 or "每日全 App 精選" not in text:
                  sys.exit(f"STOP {mid}: old={n}，內容不符，先別改，回報統籌")
              fixed = text.replace(OLD, NEW)
              if len(fixed) > 4096:
                  sys.exit(f"STOP {mid}: 超過 4096 字")
              print(f"OK {mid} old=1 len={len(fixed)}")
              if not apply:
                  continue
              token = __import__("os").environ["TELEGRAM_BOT_TOKEN"].strip()
              body = urllib.parse.urlencode({"chat_id": "@LumiApps2026", "message_id": mid, "text": fixed,
                                             "disable_web_page_preview": "false"}).encode()
              res = json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{token}/editMessageText", body, timeout=30))
              print(f"  edited {mid}: ok={res.get('ok')}")
          PY
      - name: preview
        run: python3 /tmp/tg_digest_fix_1121.py
      - name: apply
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 /tmp/tg_digest_fix_1121.py --apply
      - name: readback
        run: |
          sleep 30
          python3 /tmp/tg_digest_fix_1121.py || true
