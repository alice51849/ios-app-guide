name: tg-pin-mochi-duo-1122 (one-off)
# 一次性：照 00_GrowthEngine ops/handoff/inbox/local_pin_mochi_duo_2026-11-22.md 第 1 節，在 Lumi Apps 頻道發一則兩款主推並置頂。跑完即移除本檔。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: send and pin
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PIN_TEXT_B64: ""
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request, urllib.error
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          text = base64.b64decode(os.environ["PIN_TEXT_B64"]).decode("utf-8")
          def call(method, **params):
              body = urllib.parse.urlencode(params).encode()
              try:
                  return json.load(urllib.request.urlopen(f"https://api.telegram.org/bot{token}/{method}", body, timeout=30))
              except urllib.error.HTTPError as e:
                  return json.loads(e.read().decode("utf-8", "replace"))
          r = call("sendMessage", chat_id="@LumiApps2026", text=text, disable_web_page_preview="true")
          print("send ok=", r.get("ok"), "message_id=", (r.get("result") or {}).get("message_id"), r.get("description"))
          if not r.get("ok"):
              raise SystemExit(1)
          mid = r["result"]["message_id"]
          p = call("pinChatMessage", chat_id="@LumiApps2026", message_id=mid, disable_notification="true")
          print("pin ok=", p.get("ok"), p.get("description"))
          if not p.get("ok"):
              raise SystemExit(2)
          PY
