name: Threads daily post

on:
  schedule:
    - cron: "0 3 * * *"    # 台灣 11:00
    - cron: "0 7 * * *"    # 歐洲早 / 中東
    - cron: "0 14 * * *"   # 歐洲
    - cron: "0 19 * * *"   # 美洲
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: threads-daily-social
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      ASC_GROWTH_SIGNALS_B64: ${{ secrets.ASC_GROWTH_SIGNALS_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Prevent duplicate UTC slot
        id: slot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/social_slot_gate.py
          --workflow threads-daily.yml
          --slots 3,7,14,19
      - name: Verify social automation
        if: steps.slot.outputs.should_post == 'true'
        run: |
          python3 .github/scripts/test_social_slot_gate.py -q
          python3 .github/scripts/test_social_posting.py -q
      - name: Post to Threads (free, no OpenAI)
        if: steps.slot.outputs.should_post == 'true'
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python3 .github/scripts/threads_post.py
