<!-- hero-task-resources-v1:start --><section class="hero-resource" data-primary-resource="hero-task"><article><h2>কেনাকাটা তুলনা করুন কাজের ঘণ্টায়</h2><p>হাতে পাওয়া ঘণ্টাপ্রতি আয় দিয়ে কেনাকাটা তুলনা করে নিজের CSV ডাউনলোড করুন।</p><a class="button" href="https://open.cait518.cc/ios-app-guide/bn-BD/tools/purchase-worktime-sheet.html">আপনার ফলাফল</a> <a href="https://open.cait518.cc/ios-app-guide/bn-BD/tools/results/purchase-worktime-sheet.csv" download>উদাহরণ CSV ডাউনলোড</a><p>মোট = পরিমাণ × চূড়ান্ত একক মূল্য। কাজের ঘণ্টা = মোট ÷ ঘণ্টাপ্রতি নিট আয়। কর্মদিবস = কাজের ঘণ্টা ÷ প্রতিদিন কাজের ঘণ্টা।</p></article></section><!-- hero-task-resources-v1:end -->
