<!-- hero-task-resources-v1:start --><section class="hero-resource" data-primary-resource="hero-task"><article><h2>ખરીદીની સરખામણી કામના કલાકોમાં</h2><p>તમારી ચોખ્ખી કલાકદીઠ આવકથી ખરીદીની સરખામણી કરો અને તમારું CSV ડાઉનલોડ કરો.</p><a class="button" href="https://open.cait518.cc/ios-app-guide/gu-IN/tools/purchase-worktime-sheet.html">તમારું પરિણામ</a> <a href="https://open.cait518.cc/ios-app-guide/gu-IN/tools/results/purchase-worktime-sheet.csv" download>ઉદાહરણ CSV ડાઉનલોડ</a><p>કુલ = જથ્થો × અંતિમ એકમ કિંમત. કામના કલાક = કુલ ÷ કલાકદીઠ ચોખ્ખી આવક. કાર્યદિવસ = કામના કલાક ÷ દરરોજના કામના કલાક.</p></article></section><!-- hero-task-resources-v1:end -->
