<!-- hero-task-resources-v1:start --><section class="hero-resource" data-primary-resource="hero-task"><article><h2>ಖರೀದಿಗಳನ್ನು ಕೆಲಸದ ಗಂಟೆಗಳಲ್ಲಿ ಹೋಲಿಸಿ</h2><p>ನಿಮ್ಮ ನಿವ್ವಳ ಗಂಟೆಯ ಆದಾಯದಿಂದ ಖರೀದಿಗಳನ್ನು ಹೋಲಿಸಿ, ನಿಮ್ಮ CSV ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ.</p><a class="button" href="https://open.cait518.cc/ios-app-guide/kn-IN/tools/purchase-worktime-sheet.html">ನಿಮ್ಮ ಫಲಿತಾಂಶ</a> <a href="https://open.cait518.cc/ios-app-guide/kn-IN/tools/results/purchase-worktime-sheet.csv" download>ಉದಾಹರಣೆ CSV ಡೌನ್‌ಲೋಡ್</a><p>ಒಟ್ಟು = ಪ್ರಮಾಣ × ಅಂತಿಮ ಬೆಲೆ. ಕೆಲಸದ ಗಂಟೆಗಳು = ಒಟ್ಟು ÷ ಗಂಟೆಗೆ ನಿವ್ವಳ ಆದಾಯ. ಕೆಲಸದ ದಿನಗಳು = ಕೆಲಸದ ಗಂಟೆಗಳು ÷ ದಿನದ ಕೆಲಸದ ಗಂಟೆಗಳು.</p></article></section><!-- hero-task-resources-v1:end -->
