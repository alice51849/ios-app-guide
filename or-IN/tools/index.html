<!-- hero-task-resources-v1:start --><section class="hero-resource" data-primary-resource="hero-task"><article><h2>କିଣାକିଣିକୁ କାମ ଘଣ୍ଟାରେ ତୁଳନା କରନ୍ତୁ</h2><p>ଆପଣଙ୍କ ଘଣ୍ଟାପିଛା ନିଟ୍ ଆୟରେ କିଣାକିଣି ତୁଳନା କରି ନିଜ CSV ଡାଉନଲୋଡ୍ କରନ୍ତୁ।</p><a class="button" href="https://open.cait518.cc/ios-app-guide/or-IN/tools/purchase-worktime-sheet.html">ଆପଣଙ୍କ ଫଳାଫଳ</a> <a href="https://open.cait518.cc/ios-app-guide/or-IN/tools/results/purchase-worktime-sheet.csv" download>ଉଦାହରଣ CSV ଡାଉନଲୋଡ୍</a><p>ମୋଟ = ପରିମାଣ × ଅନ୍ତିମ ଏକକ ମୂଲ୍ୟ। କାମ ଘଣ୍ଟା = ମୋଟ ÷ ଘଣ୍ଟାପିଛା ନିଟ୍ ଆୟ। କାର୍ଯ୍ୟଦିନ = କାମ ଘଣ୍ଟା ÷ ଦୈନିକ କାମ ଘଣ୍ଟା।</p></article></section><!-- hero-task-resources-v1:end -->
