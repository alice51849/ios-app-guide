<!-- hero-task-resources-v1:start --><section class="hero-resource" data-primary-resource="hero-task"><article><h2>ਖਰੀਦਾਂ ਦੀ ਤੁਲਨਾ ਕੰਮ ਦੇ ਘੰਟਿਆਂ ਵਿੱਚ</h2><p>ਆਪਣੀ ਪ੍ਰਤੀ ਘੰਟਾ ਸ਼ੁੱਧ ਆਮਦਨ ਨਾਲ ਖਰੀਦਾਂ ਦੀ ਤੁਲਨਾ ਕਰੋ ਅਤੇ ਆਪਣਾ CSV ਡਾਊਨਲੋਡ ਕਰੋ।</p><a class="button" href="https://open.cait518.cc/ios-app-guide/pa-IN/tools/purchase-worktime-sheet.html">ਤੁਹਾਡਾ ਨਤੀਜਾ</a> <a href="https://open.cait518.cc/ios-app-guide/pa-IN/tools/results/purchase-worktime-sheet.csv" download>ਉਦਾਹਰਨ CSV ਡਾਊਨਲੋਡ</a><p>ਕੁੱਲ = ਗਿਣਤੀ × ਅੰਤਿਮ ਇਕਾਈ ਕੀਮਤ। ਕੰਮ ਦੇ ਘੰਟੇ = ਕੁੱਲ ÷ ਪ੍ਰਤੀ ਘੰਟਾ ਸ਼ੁੱਧ ਆਮਦਨ। ਕੰਮਕਾਜੀ ਦਿਨ = ਕੰਮ ਦੇ ਘੰਟੇ ÷ ਰੋਜ਼ਾਨਾ ਕੰਮ ਦੇ ਘੰਟੇ।</p></article></section><!-- hero-task-resources-v1:end -->
