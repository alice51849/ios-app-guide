<main><h1>本手冊的使用方式</h1><p>注音符號又稱 Zhuyin 或 Bopomofo，是台灣最常見的漢語標音系統。本手冊依固定順序收錄全部 37 個基本符號。</p><p>每筆資料提供實用的漢語拼音對照、寬式 IPA 與一個繁體中文例字；實際發音仍會受音節環境影響，應搭配流利的口語示範。</p><p>本手冊適合查找與複習，不是語音課程、發音測驗、診斷工具或入學準備評量。</p><p class="note">21 initials · 3 medials · 13 finals</p></main>
