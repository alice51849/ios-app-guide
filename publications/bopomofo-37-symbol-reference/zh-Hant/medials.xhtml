<main><h1>介音</h1><p>3 個可位於聲母與韻母之間的介音符號。</p><section class="symbol-card" data-symbol-id="u3127" aria-labelledby="heading-u3127"><h2 id="heading-u3127"><span lang="zh-Bopo">ㄧ</span><span class="pinyin"> — i / yi</span></h2><dl><div><dt>漢語拼音</dt><dd>i / yi</dd></div><div><dt>寬式 IPA</dt><dd>/i/</dd></div><div><dt>Unicode</dt><dd>U+3127</dd></div></dl><p class="example"><strong>例字:</strong> <span lang="zh-Hant">一</span> <span>(yī)</span> — <span lang="zh-Hant">一</span></p></section>
<section class="symbol-card" data-symbol-id="u3128" aria-labelledby="heading-u3128"><h2 id="heading-u3128"><span lang="zh-Bopo">ㄨ</span><span class="pinyin"> — u / wu</span></h2><dl><div><dt>漢語拼音</dt><dd>u / wu</dd></div><div><dt>寬式 IPA</dt><dd>/u/</dd></div><div><dt>Unicode</dt><dd>U+3128</dd></div></dl><p class="example"><strong>例字:</strong> <span lang="zh-Hant">五</span> <span>(wǔ)</span> — <span lang="zh-Hant">五</span></p></section>
<section class="symbol-card" data-symbol-id="u3129" aria-labelledby="heading-u3129"><h2 id="heading-u3129"><span lang="zh-Bopo">ㄩ</span><span class="pinyin"> — ü / yu</span></h2><dl><div><dt>漢語拼音</dt><dd>ü / yu</dd></div><div><dt>寬式 IPA</dt><dd>/y/</dd></div><div><dt>Unicode</dt><dd>U+3129</dd></div></dl><p class="example"><strong>例字:</strong> <span lang="zh-Hant">魚</span> <span>(yú)</span> — <span lang="zh-Hant">魚</span></p></section></main>
