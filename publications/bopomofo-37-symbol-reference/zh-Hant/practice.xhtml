<main><h1>低壓力五分鐘複習法</h1><ol><li>從同一章挑選五個符號。</li><li>先看符號，再核對拼音與寬式 IPA。</li><li>跟著流利示範念例字，不要只靠文字猜音。</li><li>遮住參考資料，回想一次符號或拼音。</li><li>五分鐘就停止，下次改選另一組。</li></ol></main>
