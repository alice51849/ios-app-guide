<text class="context" x="100" y="457" font-size="16" text-anchor="start" transform="translate(100 0) scale(0.4984 1) translate(-100 0)">പുറത്തേക്കുള്ള സമയം ആസൂത്രണം ചെയ്യുന്ന മാതാപിതാക്കൾക്ക് താപനില മാത്രം പോരാ: കാലാവസ്ഥ കുട്ടിക്ക് അനുയോജ്യമാണോ, ഏത് വസ്ത്രമാണ് ചേരുന്നത് എന്നിവ പ്രായം കണക്കിലെടുത്ത് വേഗത്തിൽ മനസ്സിലാക്കണം. അതിനുവേണ്ടിയാണ് Lumi Weather ഉണ്ടാക്കിയത്.</text>
