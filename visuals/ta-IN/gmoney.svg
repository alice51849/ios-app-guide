<text class="context" x="100" y="457" font-size="16" text-anchor="start" transform="translate(100 0) scale(0.4579 1) translate(-100 0)">ஒரு பயணத்தில், தரவு இல்லாத நாட்டில் ஆஃப்லைனில் வேலை செய்யும், பல நாணயங்களை கையாளும், கணக்கு கேட்காத பட்ஜெட் கண்காணிப்பாளர் தேவை — பயண வாரியாக ஒழுங்குபடுத்தப்பட்டு ஒவ்வொரு விடுமுறையும் தனித்தனியாக இருக்கும் — G+Money இதற்காக உருவாக்கப்பட்டுள்ளது.</text>
