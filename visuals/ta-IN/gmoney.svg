<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description" xml:lang="ta-IN" direction="ltr">
<title id="title">சந்தா இல்லாத சிறந்த பயண பட்ஜெட் கண்காணிப்பாளர் செயலி iPhone க்கான</title>
<desc id="description">ஒரு பயணத்தில், தரவு இல்லாத நாட்டில் ஆஃப்லைனில் வேலை செய்யும், பல நாணயங்களை கையாளும், கணக்கு கேட்காத பட்ஜெட் கண்காணிப்பாளர் தேவை — பயண வாரியாக ஒழுங்குபடுத்தப்பட்டு ஒவ்வொரு விடுமுறையும் தனித்தனியாக இருக்கும் — G+Money இதற்காக உருவாக்கப்பட்டுள்ளது. பணம் செலுத்தி பதிவிறக்கவும்</desc>
