<text class="context" x="100" y="457" font-size="16" text-anchor="start" transform="translate(100 0) scale(0.2203 1) translate(-100 0)">BattAI • BattAI పబ్లిక్ iOS APIల నుంచి 5 విలువలను వాడుతుంది: బ్యాటరీ స్థాయి, ఛార్జ్ స్థితి, Low Power Mode, మొత్తం పరికరపు ఉష్ణ స్థితి, సమయం. ఇతర ఫలితాలు ఈ కొలతల నుంచి లెక్కించబడతాయి లేదా మీరు జోడిస్తారు. ప్రతి వివరంలో మూలం, పరిమితి కనిపిస్తాయి. • BattAIలో ఖాతా, టెలిమెట్రీ, ప్రకటనలు లేదా నెట్‌వర్క్ అభ్యర్థనలు లేవు. డేటా ఈ పరికరంలోనే ఉంటుంది; పరిమిత ఫీచర్ల చిన్న స్నాప్‌షాట్ మాత్రమే జత చేసిన Apple Watchకు నేరుగా పంపబడుతుంది. కొలత పరిమితం, విశ్లేషణ గరిష్ఠంగా ప్రతి 5 minకు, అంచనాలు పరిధులుగా, లేని డేటా లేనట్టుగానే ఉంటుంది.</text>
